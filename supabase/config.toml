# Supabase config for the Signal social portal.
#
# oauth-callback deliberately has verify_jwt = false: OAuth providers redirect the
# browser to it with no Authorization header, so JWT verification would reject every
# callback. It is instead gated on a single-use state token that oauth-start writes
# to social.oauth_states and that expires after 15 minutes.

project_id = "qeafetctmtnqonhwhhlw"

[functions.sync-youtube]
verify_jwt = true

# add-youtube-channel registers a YouTube channel for public-only tracking using an
# API key, with no OAuth. Brand Accounts are separate identities that cannot authorise
# an Internal app, so an API key is the only way to reach their public data.
[functions.add-youtube-channel]
verify_jwt = true

[functions.sync-meta]
verify_jwt = true

# sync-instagram uses Business Login for Instagram on graph.instagram.com and
# requires no Facebook Page. That is what separates it from sync-meta, which
# reads Instagram through a Page access token on graph.facebook.com.
[functions.sync-instagram]
verify_jwt = true

[functions.sync-tiktok]
verify_jwt = true

[functions.sync-all]
verify_jwt = true

# oauth-start is browser-opened to begin a connect (a pasted URL / redirect carries no
# Authorization header), so verify_jwt is OFF -- like oauth-callback. It only mints a
# consent URL and stores a random single-use CSRF state; oauth-callback then verifies the
# state and the consenting identity before any token is stored, so a public start is safe.
# This matches the deployed function, which documents the same rationale. Do NOT flip to
# true: a redeploy that did so would reject the browser-opened start and break connect.
[functions.oauth-start]
verify_jwt = false

[functions.oauth-callback]
verify_jwt = false

# probe is a read-only diagnostic: it calls the upstream platform APIs and returns their
# raw response shape, writing nothing to the database.
[functions.probe]
verify_jwt = true

# publish-read publishes queued Reads to the aubreynorth repo via the GitHub
# Contents API. Requires the GITHUB_TOKEN secret.
[functions.publish-read]
verify_jwt = true

# read-diff is the read-only "what changed" companion to publish-read: it compares a
# queued Read against the live file in aubreynorth. Same verify_jwt posture, same
# GITHUB_TOKEN secret (Contents read only). Never writes.
[functions.read-diff]
verify_jwt = true

# suggest-fixes powers the editor's "Suggest fixes" button (live AI line edits).
# verify_jwt on (a signed-in portal session), same as publish-read/read-diff. Secrets:
# ANTHROPIC_API_KEY + GITHUB_TOKEN (reads VOICE-RULES.md from aubreynorth@main).
[functions.suggest-fixes]
verify_jwt = true

# generate-social generates the platform versions (X Article, X post, LinkedIn Newsletter,
# LinkedIn post, micro-posts) of a READY Read into reads_queue.social. verify_jwt on (a
# signed-in portal session), same as suggest-fixes/publish-read. It never posts anything --
# it writes copy for Demetri to Copy/paste by hand. Secrets: ANTHROPIC_API_KEY (shared with
# suggest-fixes) + GITHUB_TOKEN (reads VOICE-RULES.md + DISTRIBUTION-STRATEGY.md from
# aubreynorth@main). Model overridable via SOCIAL_MODEL.
[functions.generate-social]
verify_jwt = true

# insert-draft is how the HEADLESS drafting engine writes drafts to reads_queue without
# holding the service-role key (the key lives only in this function). It is gated on the
# DRAFT_INSERT_SECRET shared secret via a constant-time check, so verify_jwt is OFF here
# (the caller has no user JWT) -- the second deliberate verify_jwt=false after
# oauth-callback. REVIEW before deploy. Secrets: DRAFT_INSERT_SECRET, GITHUB_TOKEN,
# SUPABASE_SERVICE_ROLE_KEY.
[functions.insert-draft]
verify_jwt = false
