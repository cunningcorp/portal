# Supabase config for the Signal social portal.
#
# oauth-callback deliberately has verify_jwt = false: OAuth providers redirect the
# browser to it with no Authorization header, so JWT verification would reject every
# callback. It is instead gated on a single-use state token that oauth-start writes
# to social.oauth_states and that expires after 15 minutes.

project_id = "qeafetctmtnqonhwhhlw"

[functions.sync-youtube]
verify_jwt = true

# add-youtube-channel registers a YouTube channel for public-only tracking using an
# API key, with no OAuth. Brand Accounts are separate identities that cannot authorise
# an Internal app, so an API key is the only way to reach their public data.
[functions.add-youtube-channel]
verify_jwt = true

[functions.sync-meta]
verify_jwt = true

# sync-instagram uses Business Login for Instagram on graph.instagram.com and
# requires no Facebook Page. That is what separates it from sync-meta, which
# reads Instagram through a Page access token on graph.facebook.com.
[functions.sync-instagram]
verify_jwt = true

[functions.sync-tiktok]
verify_jwt = true

[functions.sync-all]
verify_jwt = true

# oauth-start is browser-opened to begin a connect (a pasted URL / redirect carries no
# Authorization header), so verify_jwt is OFF -- like oauth-callback. It only mints a
# consent URL and stores a random single-use CSRF state; oauth-callback then verifies the
# state and the consenting identity before any token is stored, so a public start is safe.
# This matches the deployed function, which documents the same rationale. Do NOT flip to
# true: a redeploy that did so would reject the browser-opened start and break connect.
[functions.oauth-start]
verify_jwt = false

[functions.oauth-callback]
verify_jwt = false

# probe is a read-only diagnostic: it calls the upstream platform APIs and returns their
# raw response shape, writing nothing to the database.
[functions.probe]
verify_jwt = true

# publish-read publishes queued Reads to the aubreynorth repo via the GitHub
# Contents API. Requires the GITHUB_TOKEN secret.
[functions.publish-read]
verify_jwt = true

# read-diff is the read-only "what changed" companion to publish-read: it compares a
# queued Read against the live file in aubreynorth. Same verify_jwt posture, same
# GITHUB_TOKEN secret (Contents read only). Never writes.
[functions.read-diff]
verify_jwt = true

# suggest-fixes powers the editor's "Suggest fixes" button (live AI line edits).
# verify_jwt on (a signed-in portal session), same as publish-read/read-diff. Secrets:
# ANTHROPIC_API_KEY + GITHUB_TOKEN (reads VOICE-RULES.md from aubreynorth@main).
[functions.suggest-fixes]
verify_jwt = true

# generate-social generates the platform versions (X Article, X post, LinkedIn Newsletter,
# LinkedIn post, micro-posts) of a READY Read into reads_queue.social. verify_jwt on (a
# signed-in portal session), same as suggest-fixes/publish-read. It never posts anything --
# it writes copy for Demetri to Copy/paste by hand. Secrets: ANTHROPIC_API_KEY (shared with
# suggest-fixes) + GITHUB_TOKEN (reads VOICE-RULES.md + DISTRIBUTION-STRATEGY.md from
# aubreynorth@main). Model overridable via SOCIAL_MODEL.
[functions.generate-social]
verify_jwt = true

# insert-draft is how the HEADLESS drafting engine writes drafts to reads_queue without
# holding the service-role key (the key lives only in this function). It is gated on the
# DRAFT_INSERT_SECRET shared secret via a constant-time check, so verify_jwt is OFF here
# (the caller has no user JWT) -- the second deliberate verify_jwt=false after
# oauth-callback. REVIEW before deploy. Secrets: DRAFT_INSERT_SECRET, GITHUB_TOKEN,
# SUPABASE_SERVICE_ROLE_KEY.
[functions.insert-draft]
verify_jwt = false

# insert-prospect is how the HEADLESS daily prospecting task writes rows to outreach_queue
# (both lanes) without holding the service-role key -- the twin of insert-draft. Gated on
# PROSPECT_INSERT_SECRET (a separate secret, so one leak opens one queue) via a constant-time
# check, so verify_jwt is OFF here -- the third deliberate verify_jwt=false after
# oauth-callback and insert-draft. It inserts status='in_review' only and enforces the
# outreach spine + hard-block hype scan server-side. REVIEW before deploy.
# Secrets: PROSPECT_INSERT_SECRET, SUPABASE_SERVICE_ROLE_KEY.
[functions.insert-prospect]
verify_jwt = false

# sign-coverage-script mints a short-lived (5 min) signed URL for an order's private script
# PDF, called by the Orders tab on "View script". verify_jwt on (a signed-in portal session);
# the coverage-scripts bucket stays fully private (zero policies) — this service-role function
# is the only path to the file. Secret: SUPABASE_SERVICE_ROLE_KEY (auto-injected).
[functions.sign-coverage-script]
verify_jwt = true

# list-prospects is the DEDUPE READ for the headless daily prospecting task. (It began as an
# Apollo seed function, but Apollo's mixed_people/api_search proved paid-only on Demetri's
# Free plan -- see the function header -- so discovery moved into the task via web search and
# this returns what's already queued so DD is never spent on a company we already hold.) It
# WRITES NOTHING (reads outreach_queue via the service role, returns dedupe keys only). Gated
# on LIST_PROSPECTS_SECRET via a constant-time check, so verify_jwt is OFF -- the fourth
# deliberate verify_jwt=false after oauth-callback, insert-draft and insert-prospect.
# Secrets: LIST_PROSPECTS_SECRET, SUPABASE_SERVICE_ROLE_KEY (no Apollo key).
[functions.list-prospects]
verify_jwt = false

# sync-search is the Aubrey North Search Signal collector (an-search-signal-SPEC): pulls
# Google Search Console performance (site/query/page + the per-Read target_query tie-in) into
# public.search_metrics_daily / read_search on a daily cadence. verify_jwt on, same as the
# sync-youtube family. Writes via the service role; the search tables are read-only for the
# client. Secret: GOOGLE_SA_JSON (service-account key). Config: GSC_PROPERTY env
# (default sc-domain:aubreynorth.com). GA4 + PageSpeed are added in Phase 2.
[functions.sync-search]
verify_jwt = true

# search-connect is the one-shot OAuth connect for the Search Signal collector (isolated from
# the shared oauth-* functions). verify_jwt=false -- Google's redirect carries no JWT -- gated
# on a single-use CSRF state in social.oauth_states, and it proves GSC property access before
# storing the token. Reuses GOOGLE_CLIENT_ID/SECRET; stores the refresh token in
# public.search_oauth. Redirect URI to register on the Google OAuth client:
# https://qeafetctmtnqonhwhhlw.supabase.co/functions/v1/search-connect
[functions.search-connect]
verify_jwt = false

# list-read-edits is the READ the weekly learning pass calls to pull recent read_edits rows
# (LEARNING-LOOP-SPEC Part 2). read_edits is authenticated-SELECT only and the pass is a
# headless task with no user session, so it reads via the service role here, gated on a
# constant-time LEARNING_PASS_SECRET check -- so verify_jwt is OFF, the fifth deliberate
# verify_jwt=false after oauth-callback, insert-draft, insert-prospect and list-prospects.
# It WRITES NOTHING. Secrets: LEARNING_PASS_SECRET, SUPABASE_SERVICE_ROLE_KEY.
[functions.list-read-edits]
verify_jwt = false
