document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

\u002Fh1>\n    <p style=\"font-family:var(--font-head);font-weight:300;font-size:23px;line-height:1.34;color:var(--text-secondary);margin:0 0 var(--space-4);max-width:66ch;text-wrap:pretty\">The rail is navigation and the lede is content — they were never competing for the same slot. What the merge forces is that the summary has to follow the scope.<\u002Fp>\n    <p style=\"font-size:var(--text-body);line-height:1.62;color:var(--text-tertiary);margin:0;max-width:78ch\"><strong style=\"color:var(--text-secondary)\">This one is live — click anything in the rail.<\u002Fstrong> The lede, figures, chart, cards and posts re-scope together, and the availability matrix dims the platforms you are no longer looking at. A summary that kept describing four accounts while you read one would be worse than no summary at all.<\u002Fp>\n  <\u002Fdiv>\n\n  <div id=\"2a\" style=\"width:1280px\">\n    <div style=\"display:flex;align-items:baseline;gap:var(--space-3);margin:0 0 var(--space-2)\">\n      <span style=\"font-family:var(--font-body);font-weight:600;font-size:var(--text-label);letter-spacing:var(--track-label);color:var(--text-on-accent);background:var(--brand-gold);border-radius:var(--radius-sm);padding:2px var(--space-2)\">2a<\u002Fspan>\n      <h2 style=\"font-family:var(--font-head);font-weight:300;font-size:32px;letter-spacing:-0.01em;margin:0;color:var(--text-primary)\">Board + Briefing<\u002Fh2>\n      <span style=\"font-size:var(--text-label);color:var(--text-tertiary)\">1c's rail · 1b's lede · scope-aware<\u002Fspan>\n    <\u002Fdiv>\n    <p style=\"font-size:var(--text-body);line-height:1.6;color:var(--text-secondary);margin:0 0 var(--space-5);max-width:88ch\">Scoped views drop the figures the data contract cannot give per account — engagement rate lives on posts, not accounts, so rather than invent an average it is replaced by the lifetime post count and snapshot date.<\u002Fp>\n\n    <div style=\"border:1px solid var(--border-default);border-radius:var(--radius-lg);overflow:hidden;background:var(--surface-base);box-shadow:var(--shadow-overlay);display:grid;grid-template-columns:248px 1fr\">\n\n      <div style=\"background:var(--surface-raised);border-right:1px solid var(--border-subtle);display:flex;flex-direction:column;min-height:1240px\">\n        <div style=\"display:flex;align-items:center;gap:var(--space-3);padding:var(--space-5)\">\n          <svg sc-camel-view-box=\"0 0 32 32\" style=\"width:18px;height:18px;flex:none\" aria-hidden=\"true\"><circle cx=\"16\" cy=\"16\" r=\"9\" fill=\"none\" stroke=\"var(--brand-peri)\" stroke-width=\"2\"><\u002Fcircle><circle cx=\"16\" cy=\"7\" r=\"2.6\" fill=\"var(--brand-gold)\"><\u002Fcircle><\u002Fsvg>\n          <span style=\"font-family:var(--font-display);font-size:15px;letter-spacing:var(--track-display);color:var(--text-primary)\">SIGNAL<\u002Fspan>\n        <\u002Fdiv>\n        <div style=\"padding:0 var(--space-3)\">\n          <sc-for list=\"{{ m.rail }}\" as=\"n\" hint-placeholder-count=\"8\">\n            <div onclick=\"{{ n.on }}\" style=\"{{ n.rowStyle }}\" style-hover=\"background:var(--surface-overlay)\">\n              <span style=\"{{ n.dotStyle }}\"><\u002Fspan>\n              <span style=\"flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap\">{{ n.label }}<\u002Fspan>\n              <span style=\"{{ n.metaStyle }}\">{{ n.meta }}<\u002Fspan>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n        <div style=\"flex:1\"><\u002Fdiv>\n        <div style=\"padding:var(--space-5);border-top:1px solid var(--border-subtle)\">\n          <div style=\"display:flex;align-items:center;gap:var(--space-2);margin-bottom:var(--space-2)\">\n            <span style=\"width:6px;height:6px;border-radius:50%;background:var(--state-positive);animation:sigPulse 2.4s ease-in-out infinite\"><\u002Fspan>\n            <span style=\"font-size:var(--text-micro);letter-spacing:var(--track-label);text-transform:uppercase;color:var(--text-tertiary)\">Synced {{ f.syncedAgo }}<\u002Fspan>\n          <\u002Fdiv>\n          <p style=\"font-size:var(--text-micro);color:var(--text-tertiary);margin:0 0 var(--space-4);line-height:1.5\">Daily at {{ f.syncedAt }}. Next run {{ f.nextRun }}.<\u002Fp>\n          <div style=\"display:block;text-align:center;font-size:var(--text-label);font-weight:600;color:var(--text-on-accent);background:var(--brand-peri);border-radius:var(--radius-md);padding:var(--space-3);cursor:pointer\">Sync now<\u002Fdiv>\n          <div style=\"display:block;text-align:center;font-size:var(--text-label);color:var(--text-secondary);border:1px solid var(--border-default);border-radius:var(--radius-md);padding:var(--space-3);margin-top:var(--space-2);cursor:pointer\">Connect account<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div>\n        <div style=\"display:flex;align-items:center;gap:var(--space-4);padding:var(--space-3) var(--space-5);border-bottom:1px solid var(--border-subtle);background:var(--surface-raised)\">\n          <span style=\"font-size:var(--text-micro);letter-spacing:var(--track-label);text-transform:uppercase;color:var(--text-tertiary)\">Scope<\u002Fspan>\n          <span style=\"font-family:var(--font-head);font-weight:300;font-size:var(--figure-sm);color:var(--text-primary)\">{{ m.scopeTitle }}<\u002Fspan>\n          <span style=\"font-size:var(--text-label);color:var(--text-tertiary)\">· {{ m.scopeSub }}<\u002Fspan>\n          <sc-if value=\"{{ m.isScoped }}\" hint-placeholder-val=\"{{ false }}\">\n            <span onclick=\"{{ m.clearScope }}\" style=\"font-size:var(--text-micro);letter-spacing:var(--track-label);text-transform:uppercase;color:var(--brand-peri);border:1px solid var(--border-default);border-radius:var(--radius-pill);padding:2px var(--space-3);cursor:pointer\">Clear<\u002Fspan>\n          <\u002Fsc-if>\n          <div style=\"flex:1\"><\u002Fdiv>\n          <div style=\"display:flex;gap:2px;background:var(--surface-sunken);border:1px solid va        <div style=\"display:grid;grid-template-columns:repeat(4,1fr);gap:var(--space-4)\">\n            <sc-for list=\"{{ m.kpis }}\" as=\"k\" hint-placeholder-count=\"4\">\n              <div style=\"background:var(--surface-raised);border:1px solid var(--border-subtle);border-radius:var(--radius-lg);padding:var(--space-5);box-shadow:var(--shadow-panel)\">\n                <div style=\"font-size:var(--text-micro);letter-spacing:var(--track-label);text-transform:uppercase;color:var(--text-tertiary);margin-bottom:var(--space-3)\">{{ k.label }}<\u002Fdiv>\n                <div style=\"font-family:var(--font-head);font-weight:300;font-size:var(--figure-lg);line-height:1;letter-spacing:-0.02em;color:var(--text-primary);font-variant-numeric:tabular-nums\">{{ k.value }}<\u002Fdiv>\n                <div style=\"{{ k.subStyle }}\">{{ k.sub }}<\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n\n          <div style=\"display:grid;grid-template-columns:1.55fr 1fr;gap:var(--space-4)\">\n            <div style=\"background:var(--surface-raised);border:1px solid var(--border-subtle);border-radius:var(--radius-lg);padding:var(--space-5);box-shadow:var(--shadow-panel)\">\n              <div style=\"display:flex;align-items:baseline;justify-content:space-between;gap:var(--space-4);margin-bottom:var(--space-1)\">\n                <h3 style=\"font-family:var(--font-head);font-weight:300;font-size:var(--figure-sm);margin:0;color:var(--text-primary)\">Audience<\u002Fh3>\n                <span style=\"font-size:var(--text-micro);letter-spacing:var(--track-label);text-transform:uppercase;color:var(--avail-live);border:1px solid var(--border-default);border-radius:var(--radius-pill);padding:2px var(--space-2)\">Daily · from connection<\u002Fspan>\n              <\u002Fdiv>\n              <p style=\"font-size:var(--text-label);color:var(--text-tertiary);margin:0 0 var(--space-3)\">{{ m.scopeSub }} — one line each.<\u002Fp>\n              <div style=\"display:flex;gap:var(--space-4);flex-wrap:wrap;margin-bottom:var(--space-3)\">\n                <sc-for list=\"{{ m.chart.legend }}\" as=\"l\" hint-placeholder-count=\"2\">\n                  <span style=\"display:inline-flex;align-items:center;gap:var(--space-2);font-size:var(--text-label);color:var(--text-secondary)\"><span style=\"{{ l.dotStyle }}\"><\u002Fspan>{{ l.label }} <span style=\"color:var(--text-tertiary);font-variant-numeric:tabular-nums\">{{ l.value }}<\u002Fspan><\u002Fspan>\n                <\u002Fsc-for>\n              <\u002Fdiv>\n              <svg sc-camel-view-box=\"0 0 640 200\" style=\"width:100%;height:auto;display:block;overflow:visible\">\n                <sc-for list=\"{{ m.chart.grid }}\" as=\"g\" hint-placeholder-count=\"4\">\n                  <line x1=\"0\" y1=\"{{ g.y }}\" x2=\"640\" y2=\"{{ g.y }}\" stroke=\"var(--border-subtle)\" stroke-width=\"1\" vector-effect=\"non-scaling-stroke\"><\u002Fline>\n                <\u002Fsc-for>\n                <sc-for list=\"{{ m.chart.series }}\" as=\"s\" hint-placeholder-count=\"2\">\n                  <path d=\"{{ s.area }}\" fill=\"{{ s.tint }}\" stroke=\"none\"><\u002Fpath>\n                <\u002Fsc-for>\n                <sc-for list=\"{{ m.chart.series }}\" as=\"s\" hint-placeholder-count=\"2\">\n                  <path d=\"{{ s.line }}\" fill=\"none\" stroke=\"{{ s.color }}\" stroke-width=\"2\" stroke-linejoin=\"round\" vector-effect=\"non-scaling-stroke\"><\u002Fpath>\n                <\u002Fsc-for>\n              <\u002Fsvg>\n              <div style=\"display:flex;justify-content:space-between;margin-top:var(--space-2)\">\n                <sc-for list=\"{{ m.chart.xLabels }}\" as=\"x\" hint-placeholder-count=\"4\">\n                  <span style=\"font-size:var(--text-micro);color:var(--text-tertiary);font-variant-numeric:tabular-nums\">{{ x }}<\u002Fspan>\n                <\u002Fsc-for>\n              <\u002Fdiv>\n            <\u002Fdiv>\n\n            <div style=\"background:var(--surface-raised);border:1px solid var(--border-subtle);border-radius:var(--radius-lg);padding:var(--space-5);box-shadow:var(--shadow-panel)\">\n              <h3 style=\"font-family:var(--font-head);font-weight:300;font-size:var(--figure-sm);margin:0 0 var(--space-1);color:var(--text-primary)\">Daily activity<\u002Fh3>\n              <p style=\"font-size:var(--text-label);color:var(--text-tertiary);margin:0 0 var(--space-4)\">Different series, because the platforms measure different things.<\u002Fp>\n              <sc-if value=\"{{ m.showYt }}\" hint-placeholder-val=\"{{ true }}\">\n                <div>\n                  <div style=\"display:flex;align-items:center;justify-content:space-between;margin-bottom:var(--space-2)\">\n                    <span style=\"display:inline-flex;align-items:center;gap:var(--space-2);font-size:var(--text-label);color:var(--text-secondary)\"><span style=\"width:8px;height:8px;border-radius:2px;background:var(--data-youtube)\"><\u002Fspan>YouTube views<\u002Fspan>\n                    <span style=\"font-size:var(--text-micro);letter-spacing:var(--track-label);text-transform:uppercase;color:var(--avail-lagged)\">Lags 2–3d<\u002Fspan>\n                  <\u002Fdiv>\n                  <svg sc-camel-view-box=\"0 0 400 90\" style=\"width:100%;height:auto;display:block\">\n                    <sc-for list=\"{{ ytBars }}\" as=\"b\" hint-placeholder-count=\"8\">\n                      <rect x=\"{{ b.x }}\" y=\"{{ b.y }}\" width=\"{{ b.w }}\" height=\"{{ b.h }}\" rx=\"2\" fill=\"var(--data-youtube)\"><\u002Frect>\n                    <\u002Fsc-for>\n                  <\u002Fsvg>\n                <\u002Fdiv>\n              <\u002Fsc-if>\n              <sc-if value=\"{{ m.showIg }}\" hint-placeholder-val=\"{{ true }}\">\n                <div>\n                  <div style=\"display:flex;align-items:center;justify-content:space-between;margin:var(--space-5) 0 var(--space-2)\">\n                    <span style=\"display:inline-flex;align-items:center;gap:var(--space-2);font-size:var(--text-label);color:var(--text-secondary)\"><span style=\"width:8px;height:8px;border-radius:50%;background:var(--data-instagram)\"><\u002Fspan>Instagram reach<\u002Fspan>\n                    <span style=\"font-size:var(--text-micro);letter-spacing:var(--track-label);text-transform:uppercase;color:var(--avail-live)\">Daily<\u002Fspan>\n                  <\u002Fdiv>\n                  <svg sc-camel-view-box=\"0 0 400 90\" style=\"width:100%;height:auto;display:block;overflow:visible\">\n                    <path d=\"{{ igReach.area }}\" fill=\"var(--data-instagram-tint)\" stroke=\"none\"><\u002Fpath>\n                    <path d=\"{{ igReach.line }}\" fill=\"none\" stroke=\"var(--data-instagram)\" stroke-width=\"2\" vector-effect=\"non-scaling-stroke\"><\u002Fpath>\n                  <\u002Fsvg>\n                  <p style=\"font-size:var(--text-micro);line-height:1.55;color:var(--text-tertiary);margin:var(--space-4) 0 0;padding-top:var(--space-3);border-top:1px solid var(--border-subtle)\">Instagram has no daily views series and never will on this API — reach is the only per-day figure it returns.<\u002Fp>\n                <\u002Fdiv>\n              <\u002Fsc-if>\n              <sc-if value=\"{{ m.showNoDaily }}\" hint-placeholder-val=\"{{ false }}\">\n                <div style=\"display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:var(--space-7) var(--space-4);border:1px dashed var(--border-default);border-radius:var(--radius-md)\">\n                  <span style=\"width:11px;height:11px;border-radius:50%;border:1px dashed var(--avail-absent);margin-bottom:var(--space-3)\"><\u002Fspan>\n                  <p style=\"font-size:var(--text-label);line-height:1.6;color:var(--text-tertiary);margin:0;max-width:30ch\">{{ m.noDailyText }}<\u002Fp>\n                <\u002Fdiv>\n              <\u002Fsc-if>\n            <\u002Fdiv>\n          <\u002Fdiv>\n\n          <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:var(--space-4)\">\n            <div style=\"background:var(--surface-raised);border:1px solid var(--border-subtle);border-radius:var(--radius-lg);padding:var(--space-5);box-shadow:var(--shadow-panel)\">\n              <h3 style=\"font-family:var(--font-head);font-weight:300;font-size:var(--figure-sm);margin:0 0 var(--space-1);color:var(--text-primary)\">Accounts<\u002Fh3>\n              <p style=\"font-size:var(--text-label);color:var(--text-tertiary);margin:0 0 var(--space-4)\">{{ m.accountsHint }}<\u002Fp>\n              <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:var(--space-3)\">\n                <sc-for list=\"{{ m.accounts }}\" as=\"a\" hint-placeholder-count=\"4\">\n                  <div onclick=\"{{ a.on }}\" style=\"{{ a.cardStyle }}\" style-hover=\"border-color:var(--border-strong)\">\n                    <div style=\"display:flex;align-items:center;gap:var(--space-2);margin-bottom:var(--space-3)\">\n                      <span style=\"{{ a.pillStyle }}\">{{ a.platformLabel }}<\u002Fspan>\n                    <\u002Fdiv>\n                    <div style=\"font-size:var(--text-body);font-weight:600;color:var(--text-primary);overflow:hidden;text-overflow:ellipsis;white-space:nowrap\">{{ a.name }}<\u002Fdiv>\n                    <div style=\"font-size:var(--text-micro);color:var(--text-tertiary);margin-bottom:var(--space-3)\">{{ a.handle }}<\u002Fdiv>\n                    <div style=\"display:flex;align-items:baseline;gap:var(--space-2)\">\n                      <span style=\"font-family:var(--font-head);font-weight:300;font-size:var(--figure-sm);color:var(--text-primary);font-variant-numeric:tabular-nums\">{{ a.followers }}<\u002Fspan>\n                      <span style=\"{{ a.deltaInlineStyle }}\">{{ a.delta }}<\u002Fspan>\n                    <\u002Fdiv>\n                    <div style=\"font-size:var(--text-micro);color:var(--text-tertiary);margin-top:var(--space-1)\">{{ a.posts }} posts · as of {{ a.asOf }}<\u002Fdiv>\n                  <\u002Fdiv>\n                <\u002Fsc-for>\n              <\u002Fdiv>\n            <\u002Fdiv>\n\n            <div style=\"background:var(--surface-raised);border:1px solid var(--border-subtle);border-radius:var(--radius-lg);padding:var(--space-5);box-shadow:var(--shadow-panel)\">\n              <h3 style=\"font-family:var(--font-head);font-weight:300;font-size:var(--figure-sm);margin:0 0 var(--space-1);color:var(--text-primary)\">Availability<\u002Fh3>\n              <p style=\"font-size:var(--text-label);color:var(--text-tertiary);margin:0 0 var(--space-4)\">Dims to your scope, but never hides the comparison.<\u002Fp>\n              <div style=\"display:grid;grid-template-columns:1.5fr repeat({{ availColCount }},1fr);font-size:var(--text-label)\">\n                <div style=\"border-bottom:1px solid var(--border-default);padding:0 0 var(--space-2)\"><\u002Fdiv>\n                <sc-for list=\"{{ m.availCols }}\" as=\"c\" hint-placeholder-count=\"4\">\n                  <div style=\"{{ c.headStyle }}\">{{ c.short }}<\u002Fdiv>\n                <\u002Fsc-for>\n                <sc-for list=\"{{ m.availRows }}\" as=\"r\" hint-placeholder-count=\"8\">\n                  <div style=\"padding:var(--space-2) var(--space-3) var(--space-2) 0;border-bottom:1px solid var(--border-subtle);color:var(--text-secondary);white-space:nowrap\">{{ r.metric }}<\u002Fdiv>\n                  <sc-for list=\"{{ r.cells }}\" as=\"c\" hint-placeholder-count=\"4\">\n                    <div style=\"padding:var(--space-2) 0;border-bottom:1px solid var(--border-subtle);display:flex;align-items:center;justify-content:center\" title=\"{{ c.title }}\">\n                      <span style=\"{{ c.glyphStyle }}\"><\u002Fspan>\n                    <\u002Fdiv>\n                  <\u002Fsc-for>\n                <\u002Fsc-for>\n              <\u002Fdiv>\n              <div style=\"display:flex;flex-wrap:wrap;gap:var(--space-3);margin-top:var(--space-4);padding-top:var(--space-3);border-top:1px solid var(--border-subtle)\">\n                <sc-for list=\"{{ availLegend }}\" as=\"l\" hint-placeholder-count=\"6\">\n                  <span style=\"display:inline-flex;align-items:center;gap:var(--space-2);font-size:var(--text-micro);color:var(--text-tertiary)\"><span style=\"{{ l.glyphStyle }}\"><\u002Fspan>{{ l.label }}<\u002Fspan>\n                <\u002Fsc-for>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n\n          <div style=\"background:var(--surface-raised);border:1px solid var(--border-subtle);border-radius:var(--radius-lg);padding:var(--space-5);box-shadow:var(--shadow-panel)\">\n            <div style=\"display:flex;align-items:baseline;justify-content:space-between;gap:var(--space-4);margin-bottom:var(--space-4)\">\n              <h3 style=\"font-family:var(--font-head);font-weight:300;font-size:var(--figure-sm);margin:0;color:var(--text-primary)\">Posts<\u002Fh3>\n              <div style=\"display:flex;gap:var(--space-2)\">\n                <span style=\"font-size:var(--text-micro);letter-spacing:var(--track-label);text-transform:uppercase;color:var(--text-primary);border:1px solid var(--border-strong);border-radius:var(--radius-pill);padding:2px var(--space-3)\">All types<\u002Fspan>\n                <span style=\"font-size:var(--text-micro);letter-spacing:var(--track-label);text-transform:uppercase;color:var(--text-tertiary);border:1px solid var(--border-default);border-radius:var(--radius-pill);padding:2px var(--space-3)\">Video<\u002Fspan>\n                <span style=\"font-size:var(--text-micro);letter-spacing:var(--track-label);text-transform:uppercase;color:var(--text-tertiary);border:1px solid var(--border-default);border-radius:var(--radius-pill);padding:2px var(--space-3)\">Short / Reel<\u002Fspan>\n              <\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"display:grid;grid-template-columns:56px 96px 1.6fr 90px 80px 80px 90px;font-size:var(--text-micro);letter-spacing:var(--track-label);text-transform:uppercase;color:var(--text-tertiary);border-bottom:1px solid var(--border-default);padding-bottom:var(--space-2)\">\n              <span><\u002Fspan><span>Platform<\u002Fspan><span>Title<\u002Fspan><span style=\"text-align:right\">Published<\u002Fspan><span style=\"text-align:right\">Views<\u002Fspan><span style=\"text-align:right\">Likes<\u002Fspan><span style=\"text-align:right\">Eng %<\u002Fspan>\n            <\u002Fdiv>\n            <sc-for list=\"{{ m.posts }}\" as=\"p\" hint-placeholder-count=\"6\">\n              <div style=\"display:grid;grid-template-columns:56px 96px 1.6fr 90px 80px 80px 90px;align-items:center;padding:var(--space-2) 0;border-bottom:1px solid var(--border-subtle);font-size:var(--text-body)\">\n                <span style=\"{{ p.thumbStyle }}\"><\u002Fspan>\n                <span><span style=\"{{ p.pillStyle }}\">{{ p.platformLabel }}<\u002Fspan><\u002Fspan>\n                <span style=\"min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--text-primary)\">{{ p.title }} <span style=\"color:var(--text-tertiary)\">· {{ p.account }}<\u002Fspan><\u002Fspan>\n                <span style=\"text-align:right;color:var(--text-tertiary);font-variant-numeric:tabular-nums;font-size:var(--text-label)\">{{ p.published }}<\u002Fspan>\n                <span style=\"text-align:right;font-variant-numeric:tabular-nums;color:var(--text-secondary)\">{{ p.views }}<\u002Fspan>\n                <span style=\"text-align:right;font-variant-numeric:tabular-nums;color:var(--text-secondary)\">{{ p.likes }}<\u002Fspan>\n                <span style=\"text-align:right;font-variant-numeric:tabular-nums;color:var(--text-primary)\">{{ p.eng }}<\u002Fspan>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div style=\"display:grid;grid-template-columns:1fr 1fr 1fr;gap:var(--space-5);margin-top:var(--space-5)\">\n      <div><p style=\"font-size:var(--text-micro);letter-spacing:var(--track-label);text-transform:uppercase;color:var(--brand-gold);margin:0 0 var(--space-2)\">What the merge buys<\u002Fp><p style=\"font-size:var(--text-label);line-height:1.6;color:var(--text-secondary);margin:0\">R1 and R3 stop competing. Scope is a place you navigate to, and the lede tells you what happened <em>in that place<\u002Fem> — including the caveat that applies to it.<\u002Fp><\u002Fdiv>\n      <div><p style=\"font-size:var(--text-micro);letter-spacing:var(--track-label);text-transform:uppercase;color:var(--brand-gold);margin:0 0 var(--space-2)\">The one real cost<\u002Fp><p style=\"font-size:var(--text-label);line-height:1.6;color:var(--text-secondary);margin:0\">The lede is generated copy and now needs a rule per scope <em>and<\u002Fem> per data shape — including \"nothing moved\" and \"not enough history\". That is the work item, and it is worth doing well.<\u002Fp><\u002Fdiv>\n      <div><p style=\"font-size:var(--text-micro);letter-spacing:var(--track-label);text-transform:uppercase;color:var(--brand-gold);margin:0 0 var(--space-2)\">Flag<\u002Fp><p style=\"font-size:var(--text-label);line-height:1.6;color:var(--text-secondary);margin:0\">Account names here are placeholders drawn from the division list in <code style=\"font-family:ui-monospace,monospace;font-size:var(--text-micro)\">README.md<\u002Fcode>. Send me the real handles and I will correct them.<\u002Fp><\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section>\n  <div style=\"max-width:1000px;margin:0 0 var(--space-7)\">\n    <p style=\"font-family:var(--font-body);font-weight:600;font-size:var(--text-micro);letter-spacing:0.2em;text-transform:uppercase;color:var(--brand-gold);margin:0 0 var(--space-4)\">Turn 1 · three directions<\u002Fp>\n    <h1 style=\"font-family:var(--font-display);font-weight:400;font-size:52px;line-height:1.02;letter-spacing:var(--track-display);margin:0 0 var(--space-5);color:var(--text-primary)\">Signal<\u002Fh1>\n    <p style=\"font-family:var(--font-head);font-weight:300;font-size:26px;line-height:1.32;color:var(--text-secondary);margin:0 0 var(--space-5);max-width:70ch;text-wrap:pretty\">Three ways to answer the same two problems: the platforms don't compare, and a gap has to read as <em style=\"color:var(--brand-gold-soft);font-style:italic\">Instagram doesn't provide this<\u002Fem> rather than <em style=\"font-style:italic\">the portal is broken<\u002Fem>.<\u002Fp>\n    <p style=\"font-size:var(--text-body);line-height:1.62;color:var(--text-tertiary);margin:0 0 var(--space-4);max-width:78ch\">Each direction is the Overview tab at 1280px. All three keep the settled parts: the mark, single-file build, the five <code style=\"font-family:ui-monospace,monospace;font-size:var(--text-label);color:var(--text-secondary)\">social_*<\u002Fcode> views, platform colour as data encoding only, and one glow per layout on the primary action. Every value below is a token — the sheet is at the bottom.<\u002Fp>\n    <div style=\"display:flex;gap:var(--space-2);flex-wrap:wrap;margin-top:var(--space-5)\">\n      <span style=\"font-size:var(--text-micro);letter-spacing:var(--track-label);text-transform:uppercase;color:var(--text-tertiary);border:1px solid var(--border-default);border-radius:var(--radius-pill);padding:var(--space-1) var(--space-3)\">{{ stateLabel }}<\u002Fspan>\n      <span style=\"font-size:var(--text-micro);letter-spacing:var(--track-label);text-transform:uppercase;color:var(--text-tertiary);border:1px solid var(--border-default);border-radius:var(--radius-pill);padding:var(--space-1) var(--space-3)\">Delta window {{ deltaLabel }}<\u002Fspan>\n      <span style=\"font-size:var(--text-micro);letter-spacing:var(--track-label);text-transform:uppercase;color:var(--text-tertiary);border:1px solid var(--border-default);border-radius:var(--radius-pill);padding:var(--space-1) var(--space-3)\">Switch both in Tweaks<\u002Fspan>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div style=\"display:flex;gap:var(--space-8);align-items:flex-start;flex-wrap:wrap\">\n\n    <!-- ============================== 1a · CONSOLE ============================== -->\n    <div id=\"1a\" style=\"width:1280px;flex:none\">\n      <div style=\"display:flex;align-items:baseline;gap:var(--space-3);margin:0 0 var(--space-2)\">\n        <span style=\"font-family:var(--font-body);font-weight:600;font-size:var(--text-label);letter-spacing:var(--track-label);color:var(--text-on-accent);background:var(--brand-gold);border-radius:var(--radius-sm);padding:2px var(--space-2)\">1a<\u002Fspan>\n        <h2 style=\"font-family:var(--font-head);font-weight:300;font-size:32px;letter-spacing:-0.01em;margin:0;color:var(--text-primary)\">Console<\u002Fh2>\n        <span style=\"font-size:var(--text-label);color:var(--text-tertiary)\">Dense · top tabs · availability matrix<\u002Fspan>\n      <\u002Fdiv>\n      <p style=\"font-size:var(--text-body);line-height:1.6;color:var(--text-secondary);margin:0 0 var(--space-5);max-width:88ch\">Bets that you're reading instruments. Everything comparable sits above the fold, cards give way to rules, and every panel carries a cadence badge. The availability matrix is promoted to a first-class panel — it teaches the contract instead of apologising for it in a footnote.<\u002Fp>\n\n      <div style=\"border:1px solid var(--border-default);border-radius:var(--radius-lg);overflow:hidden;background:var(--surface-base);box-shadow:var(--shadow-overlay)\">\n\n        <div style=\"display:flex;align-items:center;gap:var(--space-4);padding:var(--space-3) var(--space-5);background:var(--surface-raised);border-bottom:1px solid var(--border-subtle)\">\n          <svg sc-camel-view-box=\"0 0 32 32\" style=\"width:18px;height:18px;flex:none\" aria-hidden=\"true\"><circle cx=\"16\" cy=\"16\" r=\"9\" fill=\"none\" stroke=\"var(--brand-peri)\" stroke-width=\"2\"><\u002Fcircle><circle cx=\"16\" cy=\"7\" r=\"2.6\" fill=\"var(--brand-gold)\"><\u002Fcircle><\u002Fsvg>\n          <span style=\"font-family:var(--font-display);font-size:15px;letter-spacing:var(--track-display);color:var(--text-primary)\">SIGNAL<\u002Fspan>\n          <span style=\"font-size:var(--text-micro);letter-spacing:var(--track-label);text-transform:uppercase;color:var(--text-tertiary);padding-left:var(--space-3);border-left:1px solid var(--border-default)\">Cunning Corp<\u002Fspan>\n          <div style=\"display:flex;gap:2px;background:var(--surface-sunken);border:1px solid var(--border-subtle);border-radius:var(--radius-md);padding:3px;margin-left:var(--space-4)\">\n            <span style=\"font-size:var(--text-label);color:var(--text-tertiary);padding:3px var(--space-3);border-radius:var(--radius-sm)\">7d<\u002Fspan>\n            <span style=\"font-size:var(--text-label);color:var(--text-primary);background:var(--surface-overlay);padding:3px var(--space-3);border-radius:var(--radius-sm)\">30d<\u002Fspan>\n            <span style=\"font-size:var(--text-label);color:var(--text-tertiary);padding:3px var(--space-3);border-radius:var(--radius-sm)\">90d<\u002Fspan>\n          <\u002Fdiv>\n          <div style=\"flex:1\"><\u002Fdiv>\n          <span style=\"font-size:var(--text-label);color:var(--text-secondary);border:1px solid var(--border-default);border-radius:var(--radius-md);padding:var(--space-2) var(--space-3)\">Connect account<\u002Fspan>\n          <span style=\"font-size:var(--text-label);font-weight:600;color:var(--text-on-accent);background:var(--brand-peri);border-radius:var(--radius-md);padding:var(--space-2) var(--space-4)\">Sync now<\u002Fspan>\n          <span style=\"font-size:var(--text-label);color:var(--text-tertiary)\">Sign out<\u002Fspan>\n        <\u002Fdiv>\n\n        <div style=\"display:flex;gap:var(--space-5);padding:0 var(--space-5);background:var(--surface-raised);border-bottom:1px solid var(--border-subtle)\">\n          <sc-for list=\"{{ tabs }}\" as=\"t\" hint-placeholder-count=\"3\">\n            <span style=\"{{ t.consoleStyle }}\"><span style=\"{{ t.dotStyle }}\"><\u002Fspan>{{ t.label }}<\u002Fspan>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n\n        <div style=\"display:flex;align-items:center;gap:var(--space-4);padding:var(--space-2) var(--space-5);background:var(--surface-sunken);border-bottom:1px solid var(--border-subtle);font-size:var(--text-micro);color:var(--text-tertiary);flex-wrap:wrap\">\n          <span style=\"display:inline-flex;align-items:center;gap:var(--space-2)\"><span style=\"width:6px;height:6px;border-radius:50%;background:var(--state-positive);animation:sigPulse 2.4s ease-in-out infinite\"><\u002Fspan>Synced {{ f.syncedAt }} · {{ f.syncedAgo }}<\u002Fspan>\n          <span style=\"color:var(--border-strong)\">·<\u002Fspan>\n          <span>Next run {{ f.nextRun }}<\u002Fspan>\n          <span style=\"color:var(--border-strong)\">·<\u002Fspan>\n          <span style=\"display:inline-flex;align-items:center;gap:var(--space-2);color:var(--brand-gold-soft)\"><span style=\"width:6px;height:6px;border-radius:50%;background:var(--avail-lagged)\"><\u002Fspan>YouTube analytics end {{ f.ytLagEnds }} — the API lags 2–3 days<\u002Fspan>\n          <div style=\"flex:1\"><\u002Fdiv>\n          <span>{{ f.historyNote }}<\u002Fspan>\n        <\u002Fdiv>\n\n        <div style=\"display:grid;grid-template-columns:repeat(5,1fr);border-bottom:1px solid var(--border-subtle);background:var(--surface-raised)\">\n          <sc-for list=\"{{ kpis }}\" as=\"k\" hint-placeholder-count=\"5\">\n            <div style=\"{{ k.cellStyle }}\">\n              <div style=\"font-size:var(--text-micro);letter-spacing:var(--track-label);text-transform:uppercase;color:var(--text-tertiary);margin-bottom:var(--space-2)\">{{ k.label }}<\u002Fdiv>\n              <div style=\"font-family:var(--font-head);font-weight:300;font-size:var(--figure-md);line-height:1;letter-spacing:-0.015em;color:var(--text-primary);font-variant-numeric:tabular-nums\">{{ k.value }}<\u002Fdiv>\n              <div style=\"{{ k.subStyle }}\">{{ k.sub }}<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n\n        <div style=\"display:grid;grid-template-columns:1.5fr 1fr;gap:1px;background:var(--border-subtle)\">\n          <div style=\"background:var(--surface-base);padding:var(--space-5)\">\n            <div style=\"display:flex;align-items:baseline;justify-content:space-between;gap:var(--space-4);margin-bottom:var(--space-1)\">\n              <h3 style=\"font-family:var(--font-head);font-weight:300;font-size:var(--figure-sm);margin:0;color:var(--text-primary)\">Audience<\u002Fh3>\n              <span style=\"font-size:var(--text-micro);letter-spacing:var(--track-label);text-transform:uppercase;color:var(--avail-live);border:1px solid var(--border-default);border-radius:var(--radius-pill);padding:2px var(--space-2)\">Daily · from connection<\u002Fspan>\n            <\u002Fdiv>\n            <p style=\"font-size:var(--text-label);color:var(--text-tertiary);margin:0 0 var(--space-4)\">Followers per platform. No platform backfills history, so the line starts the day the account was connected.<\u002Fp>\n            <div style=\"display:flex;gap:var(--space-4);margin-bottom:var(--space-3)\">\n              <sc-for list=\"{{ audience.legend }}\" as=\"l\" hint-placeholder-count=\"2\">\n                <span style=\"display:inline-flex;align-items:center;gap:var(--space-2);font-size:var(--text-label);color:var(--text-secondary)\"><span style=\"{{ l.dotStyle }}\"><\u002Fspan>{{ l.label }} <span style=\"color:var(--text-tertiary);font-variant-numeric:tabular-nums\">{{ l.value }}<\u002Fspan><\u002Fspan>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n            <svg sc-camel-view-box=\"0 0 640 200\" style=\"width:100%;height:auto;display:block;overflow:visible\">\n              <sc-for list=\"{{ audience.grid }}\" as=\"g\" hint-placeholder-count=\"4\">\n                <line x1=\"0\" y1=\"{{ g.y }}\" x2=\"640\" y2=\"{{ g.y }}\" stroke=\"var(--border-subtle)\" stroke-width=\"1\" vector-effect=\"non-scaling-stroke\"><\u002Fline>\n              <\u002Fsc-for>\n              <sc-for list=\"{{ audience.series }}\" as=\"s\" hint-placeholder-count=\"2\">\n                <path d=\"{{ s.area }}\" fill=\"{{ s.tint }}\" stroke=\"none\"><\u002Fpath>\n              <\u002Fsc-for>\n              <sc-for list=\"{{ audience.series }}\" as=\"s\" hint-placeholder-count=\"2\">\n                <path d=\"{{ s.line }}\" fill=\"none\" stroke=\"{{ s.color }}\" stroke-width=\"2\" stroke-linejoin=\"round\" vector-effect=\"non-scaling-stroke\"><\u002Fpath>\n              <\u002Fsc-for>\n            <\u002Fsvg>\n            <div style=\"display:flex;justify-content:space-between;margin-top:var(--space-2)\">\n              <sc-for list=\"{{ audience.xLabels }}\" as=\"x\" hint-placeholder-count=\"5\">\n                <span style=\"font-size:var(--text-micro);color:var(--text-tertiary);font-variant-numeric:tabular-nums\">{{ x }}<\u002Fspan>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n          <\u002Fdiv>\n\n          <div style=\"background:var(--surface-base);padding:var(--space-5)\">\n            <div style=\"display:flex;align-items:baseline;justify-content:space-between;gap:var(--space-4);margin-bottom:var(--space-1)\">\n              <h3 style=\"font-family:var(--font-head);font-weight:300;font-size:var(--figure-sm);margin:0;color:var(--text-primary)\">What each platform gives us<\u002Fh3>\n            <\u002Fdiv>\n            <p style=\"font-size:var(--text-label);color:var(--text-tertiary);margin:0 0 var(--space-4)\">A blank cell here is the API's answer, not a fault.<\u002Fp>\n            <div style=\"display:grid;grid-template-columns:1.5fr repeat({{ availColCount }},1fr);gap:0;font-size:var(--text-label)\">\n              <div style=\"border-bottom:1px solid var(--border-default);padding:0 0 var(--space-2)\"><\u002Fdiv>\n              <sc-for list=\"{{ availCols }}\" as=\"c\" hint-placeholder-count=\"4\">\n                <div style=\"{{ c.headStyle }}\">{{ c.short }}<\u002Fdiv>\n              <\u002Fsc-for>\n              <sc-for list=\"{{ availRows }}\" as=\"r\" hint-placeholder-count=\"8\">\n                <div style=\"padding:var(--space-2) var(--space-3) var(--space-2) 0;border-bottom:1px solid var(--border-subtle);color:var(--text-secondary);white-space:nowrap\">{{ r.metric }}<\u002Fdiv>\n                <sc-for list=\"{{ r.cells }}\" as=\"c\" hint-placeholder-count=\"4\">\n                  <div style=\"padding:var(--space-2) 0;border-bottom:1px solid var(--border-subtle);display:flex;align-items:center;justify-content:center\" title=\"{{ c.title }}\">\n                    <span style=\"{{ c.glyphStyle }}\"><\u002Fspan>\n                  <\u002Fdiv>\n                <\u002Fsc-for>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n            <div style=\"display:flex;flex-wrap:wrap;gap:var(--space-3);margin-top:var(--space-4);padding-top:var(--space-3);border-top:1px solid var(--border-subtle)\">\n              <sc-for list=\"{{ availLegend }}\" as=\"l\" hint-placeholder-count=\"6\">\n                <span style=\"display:inline-flex;align-items:center;gap:var(--space-2);font-size:var(--text-micro);color:var(--text-tertiary)\"><span style=\"{{ l.glyphStyle }}\"><\u002Fspan>{{ l.label }}<\u002Fspan>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <div style=\"display:grid;grid-template-columns:1.5fr 1fr;gap:1px;background:var(--border-subtle);border-top:1px solid var(--border-subtle)\">\n          <div style=\"background:var(--surface-base);padding:var(--space-5)\">\n            <div style=\"display:flex;align-items:baseline;justify-content:space-between;gap:var(--space-4);margin-bottom:var(--space-4)\">\n              <h3 style=\"font-family:var(--font-head);font-weight:300;font-size:var(--figure-sm);margin:0;color:var(--text-primary)\">Accounts<\u002Fh3>\n              <span style=\"font-size:var(--text-micro);color:var(--text-tertiary)\">{{ f.accountCount }} across {{ f.platformCount }} platforms<\u002Fspan>\n            <\u002Fdiv>\n            <div style=\"display:grid;grid-template-columns:2fr 1fr 1fr 1fr 1fr;font-size:var(--text-micro);letter-spacing:var(--track-label);text-transform:uppercase;color:var(--text-tertiary);border-bottom:1px solid var(--border-default);padding-bottom:var(--space-2)\">\n              <span>Account<\u002Fspan><span style=\"text-align:right\">Followers<\u002Fspan><span style=\"text-align:right\">{{ deltaLabel }}<\u002Fspan><span style=\"text-align:right\">Posts<\u002Fspan><span style=\"text-align:right\">As of<\u002Fspan>\n            <\u002Fdiv>\n            <sc-for list=\"{{ accounts }}\" as=\"a\" hint-placeholder-count=\"4\">\n              <div style=\"display:grid;grid-template-columns:2fr 1fr 1fr 1fr 1fr;align-items:center;padding:var(--space-3) 0;border-bottom:1px solid var(--border-subtle);font-size:var(--text-body)\">\n                <span style=\"display:flex;align-items:center;gap:var(--space-3);min-width:0\">\n                  <span style=\"{{ a.barStyle }}\"><\u002Fspan>\n                  <span style=\"min-width:0\">\n                    <span style=\"display:block;color:var(--text-primary);font-weight:600;font-size:var(--text-body);overflow:hidden;text-overflow:ellipsis;white-space:nowrap\">{{ a.name }}<\u002Fspan>\n                    <span style=\"display:block;color:var(--text-tertiary);font-size:var(--text-micro)\">{{ a.platformLabel }} · {{ a.handle }}<\u002Fspan>\n                  <\u002Fspan>\n                <\u002Fspan>\n                <span style=\"text-align:right;font-variant-numeric:tabular-nums;color:var(--text-primary)\">{{ a.followers }}<\u002Fspan>\n                <span style=\"{{ a.deltaStyle }}\">{{ a.delta }}<\u002Fspan>\n                <span style=\"text-align:right;font-variant-numeric:tabular-nums;color:var(--text-secondary)\">{{ a.posts }}<\u002Fspan>\n                <span style=\"text-align:right;font-variant-numeric:tabular-nums;color:var(--text-tertiary);font-size:var(--text-label)\">{{ a.asOf }}<\u002Fspan>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n\n          <div style=\"background:var(--surface-base);padding:var(--space-5)\">\n            <h3 style=\"font-family:var(--font-head);font-weight:300;font-size:var(--figure-sm);margin:0 0 var(--space-1);color:var(--text-primary)\">Sync health<\u002Fh3>\n            <p style=\"font-size:var(--text-label);color:var(--text-tertiary);margin:0 0 var(--space-4)\">Last collector run per account.<\u002Fp>\n            <sc-for list=\"{{ sync }}\" as=\"s\" hint-placeholder-count=\"4\">\n              <div style=\"display:flex;align-items:center;gap:var(--space-3);padding:var(--space-3) 0;border-bottom:1px solid var(--border-subtle)\">\n                <span style=\"{{ s.ledStyle }}\"><\u002Fspan>\n                <span style=\"{{ s.pillStyle }}\">{{ s.platformLabel }}<\u002Fspan>\n                <span style=\"flex:1;min-width:0;font-size:var(--text-label);color:var(--text-secondary);overflow:hidden;text-overflow:ellipsis;white-space:nowrap\">{{ s.detail }}<\u002Fspan>\n                <span style=\"font-size:var(--text-micro);color:var(--text-tertiary);white-space:nowrap\">{{ s.when }}<\u002Fspan>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <div style=\"padding:var(--space-5);border-top:1px solid var(--border-subtle);background:var(--surface-base)\">\n          <div style=\"display:flex;align-items:baseline;justify-content:space-between;gap:var(--space-4);margin-bottom:var(--space-4)\">\n            <h3 style=\"font-family:var(--font-head);font-weight:300;font-size:var(--figure-sm);margin:0;color:var(--text-primary)\">Posts<\u002Fh3>\n            <div style=\"display:flex;gap:var(--space-2)\">\n              <span style=\"font-size:var(--text-micro);letter-spacing:var(--track-label);text-transform:uppercase;color:var(--text-primary);border:1px solid var(--border-strong);border-radius:var(--radius-pill);padding:2px var(--space-3)\">All types<\u002Fspan>\n              <span style=\"font-size:var(--text-micro);letter-spacing:var(--track-label);text-transform:uppercase;color:var(--text-tertiary);border:1px solid var(--border-default);border-radius:var(--radius-pill);padding:2px var(--space-3)\">Video<\u002Fspan>\n              <span style=\"font-size:var(--text-micro);letter-spacing:var(--track-label);text-transform:uppercase;color:var(--text-tertiary);border:1px solid var(--border-default);border-radius:var(--radius-pill);padding:2px var(--space-3)\">Short / Reel<\u002Fspan>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"display:grid;grid-template-columns:56px 96px 1.6fr 90px 80px 80px 90px;font-size:var(--text-micro);letter-spacing:var(--track-label);text-transform:uppercase;color:var(--text-tertiary);border-bottom:1px solid var(--border-default);padding-bottom:var(--space-2)\">\n            <span><\u002Fspan><span>Platform<\u002Fspan><span>Title<\u002Fspan><span style=\"text-align:right\">Published<\u002Fspan><span style=\"text-align:right\">Views<\u002Fspan><span style=\"text-align:right\">Likes<\u002Fspan><span style=\"text-align:right\">Eng %<\u002Fspan>\n          <\u002Fdiv>\n          <sc-for list=\"{{ posts }}\" as=\"p\" hint-placeholder-count=\"6\">\n            <div style=\"display:grid;grid-template-columns:56px 96px 1.6fr 90px 80px 80px 90px;align-items:center;padding:var(--space-2) 0;border-bottom:1px solid var(--border-subtle);font-size:var(--text-body)\">\n              <span style=\"{{ p.thumbStyle }}\"><\u002Fspan>\n              <span><span style=\"{{ p.pillStyle }}\">{{ p.platformLabel }}<\u002Fspan><\u002Fspan>\n              <span style=\"min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--text-primary)\">{{ p.title }} <span style=\"color:var(--text-tertiary)\">· {{ p.account }}<\u002Fspan><\u002Fspan>\n              <span style=\"text-align:right;color:var(--text-tertiary);font-variant-numeric:tabular-nums;font-size:var(--text-label)\">{{ p.published }}<\u002Fspan>\n              <span style=\"text-align:right;font-variant-numeric:tabular-nums;color:var(--text-secondary)\">{{ p.views }}<\u002Fspan>\n              <span style=\"text-align:right;font-variant-numeric:tabular-nums;color:var(--text-secondary)\">{{ p.likes }}<\u002Fspan>\n              <span style=\"text-align:right;font-variant-numeric:tabular-nums;color:var(--text-primary)\">{{ p.eng }}<\u002Fspan>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div style=\"display:grid;grid-template-columns:1fr 1fr 1fr;gap:var(--space-5);margin-top:var(--space-5)\">\n        <div><p style=\"font-size:var(--text-micro);letter-spacing:var(--track-label);text-transform:uppercase;color:var(--brand-gold);margin:0 0 var(--space-2)\">Strength<\u002Fp><p style=\"font-size:var(--text-label);line-height:1.6;color:var(--text-secondary);margin:0\">Everything comparable is visible without scrolling, and the matrix answers \"why is this empty\" permanently rather than per-panel.<\u002Fp><\u002Fdiv>\n        <div><p style=\"font-size:var(--text-micro);letter-spacing:var(--track-label);text-transform:uppercase;color:var(--brand-gold);margin:0 0 var(--space-2)\">Cost<\u002Fp><p style=\"font-size:var(--text-label);line-height:1.6;color:var(--text-secondary);margin:0\">Least warm of the three. With five accounts it may read as more instrument than the job needs.<\u002Fp><\u002Fdiv>\n        <div><p style=\"font-size:var(--text-micro);letter-spacing:var(--track-label);text-transform:uppercase;color:var(--brand-gold);margin:0 0 var(--space-2)\">URL scheme<\u002Fp><p style=\"font-size:var(--text-label);line-height:1.6;color:var(--text-secondary);margin:0\"><code style=\"font-family:ui-monospace,monospace;font-size:var(--text-micro)\">/?tab=overview&amp;range=30<\u002Fcode> — tab, range, account and post-type all in the query string.<\u002Fp><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <!-- ============================== 1b · BRIEFING ============================== -->\n    <div id=\"1b\" style=\"width:1280px;flex:none\">\n      <div style=\"display:flex;align-items:baseline;gap:var(--space-3);margin:0 0 var(--space-2)\">\n        <span style=\"font-family:var(--font-body);font-weight:600;font-size:var(--text-label);letter-spacing:var(--track-label);color:var(--text-on-accent);background:var(--brand-gold);border-radius:var(--radius-sm);padding:2px var(--space-2)\">1b<\u002Fspan>\n        <h2 style=\"font-family:var(--font-head);font-weight:300;font-size:32px;letter-spacing:-0.01em;margin:0;color:var(--text-primary)\">Briefing<\u002Fh2>\n        <span style=\"font-size:var(--text-label);color:var(--text-tertiary)\">Editorial · narrative lede · gaps in plain words<\u002Fspan>\n      <\u002Fdiv>\n      <p style=\"font-size:var(--text-body);line-height:1.6;color:var(--text-secondary);margin:0 0 var(--space-5);max-width:88ch\">Bets that this is read once a day by someone who wants to be told what happened. The overview opens with a written lede assembled from the data — never a sentence the numbers don't support — and the availability contract is explained in prose rather than encoded in a grid. Figures are fewer and much larger.<\u002Fp>\n\n      <div style=\"border:1px solid var(--border-default);border-radius:var(--radius-lg);overflow:hidden;background:var(--surface-base);box-shadow:var(--shadow-overlay)\">\n\n        <div style=\"display:flex;align-items:center;gap:var(--space-4);padding:var(--space-3) var(--space-6);background:var(--surface-raised);border-bottom:1px solid var(--border-subtle)\">\n          <svg sc-camel-view-box=\"0 0 32 32\" style=\"width:18px;height:18px;flex:none\" aria-hidden=\"true\"><circle cx=\"16\" cy=\"16\" r=\"9\" fill=\"none\" stroke=\"var(--brand-peri)\" stroke-width=\"2\"><\u002Fcircle><circle cx=\"16\" cy=\"7\" r=\"2.6\" fill=\"var(--brand-gold)\"><\u002Fcircle><\u002Fsvg>\n          <span style=\"font-family:var(--font-display);font-size:15px;letter-spacing:var(--track-display);color:var(--text-primary)\">SIGNAL<\u002Fspan>\n          <span style=\"font-size:var(--text-micro);letter-spacing:var(--track-label);text-transform:uppercase;color:var(--text-tertiary);padding-left:var(--space-3);border-left:1px solid var(--border-default)\">Cunning Corp<\u002Fspan>\n          <div style=\"flex:1\"><\u002Fdiv>\n          <div style=\"display:flex;gap:2px;background:var(--surface-sunken);border:1px solid var(--border-subtle);border-radius:var(--radius-md);padding:3px\">\n            <span style=\"font-size:var(--text-label);color:var(--text-tertiary);padding:3px var(--space-3);border-radius:var(--radius-sm)\">7d<\u002Fspan>\n            <span style=\"font-size:var(--text-label);color:var(--text-primary);background:var(--surface-overlay);padding:3px var(--space-3);border-radius:var(--radius-sm)\">30d<\u002Fspan>\n            <span style=\"font-size:var(--text-label);color:var(--text-tertiary);padding:3px var(--space-3);border-radius:var(--radius-sm)\">90d<\u002Fspan>\n          <\u002Fdiv>\n          <span style=\"font-size:var(--text-label);color:var(--text-secondary);border:1px solid var(--border-default);border-radius:var(--radius-md);padding:var(--space-2) var(--space-3)\">Connect account<\u002Fspan>\n          <span style=\"font-size:var(--text-label);font-weight:600;color:var(--text-on-accent);background:var(--brand-peri);border-radius:var(--radius-md);padding:var(--space-2) var(--space-4)\">Sync now<\u002Fspan>\n          <span style=\"font-size:var(--text-label);color:var(--text-tertiary)\">Sign out<\u002Fspan>\n        <\u002Fdiv>\n\n        <div style=\"display:flex;gap:var(--space-6);padding:0 var(--space-6);background:var(--surface-raised);border-bottom:1px solid var(--border-subtle)\">\n          <sc-for list=\"{{ tabs }}\" as=\"t\" hint-placeholder-count=\"3\">\n            <span style=\"{{ t.consoleStyle }}\"><span style=\"{{ t.dotStyle }}\"><\u002Fspan>{{ t.label }}<\u002Fspan>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n\n        <div style=\"padding:var(--space-7) var(--space-7) var(--space-6)\">\n          <div style=\"display:flex;align-items:center;gap:var(--space-3);margin-bottom:var(--space-5)\">\n            <span style=\"font-family:var(--font-body);font-weight:600;font-size:var(--text-micro);letter-spacing:0.2em;text-transform:uppercase;color:var(--brand-gold)\">{{ f.dateline }}<\u002Fspan>\n            <span style=\"width:4px;height:4px;border-radius:50%;background:var(--border-strong)\"><\u002Fspan>\n            <span style=\"font-size:var(--text-micro);letter-spacing:var(--track-label);text-transform:uppercase;color:var(--text-tertiary)\">{{ f.historyNote }}<\u002Fspan>\n            <span style=\"width:4px;height:4px;border-radius:50%;background:var(--border-strong)\"><\u002Fspan>\n            <span style=\"display:inline-flex;align-items:center;gap:var(--space-2);font-size:var(--text-micro);letter-spacing:var(--track-label);text-transform:uppercase;color:var(--text-tertiary)\"><span style=\"width:6px;height:6px;border-radius:50%;background:var(--state-positive);animation:sigPulse 2.4s ease-in-out infinite\"><\u002Fspan>Synced {{ f.syncedAgo }}<\u002Fspan>\n          <\u002Fdiv>\n          <p style=\"font-family:var(--font-head);font-weight:300;font-size:38px;line-height:1.26;letter-spacing:-0.015em;color:var(--text-primary);margin:0 0 var(--space-5);max-width:34ch;text-wrap:pretty\">{{ f.ledeA }}<\u002Fp>\n          <p style=\"font-size:var(--text-lead);line-height:1.65;color:var(--text-secondary);margin:0;max-width:60ch;text-wrap:pretty\">{{ f.ledeB }}<\u002Fp>\n        <\u002Fdiv>\n\n        <div style=\"display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--border-subtle);border-top:1px solid var(--border-subtle);border-bottom:1px solid var(--border-subtle)\">\n          <sc-for list=\"{{ figures }}\" as=\"g\" hint-placeholder-count=\"3\">\n            <div style=\"background:var(--surface-base);padding:var(--space-6) var(--space-7)\">\n              <div style=\"font-size:var(--text-micro);letter-spacing:var(--track-label);text-transform:uppercase;color:var(--text-tertiary);margin-bottom:var(--space-3)\">{{ g.label }}<\u002Fdiv>\n              <div style=\"font-family:var(--font-head);font-weight:300;font-size:var(--figure-xl);line-height:0.98;letter-spacing:-0.025em;color:var(--text-primary);font-variant-numeric:tabular-nums\">{{ g.value }}<\u002Fdiv>\n              <div style=\"{{ g.subStyle }}\">{{ g.sub }}<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n\n        <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--border-subtle)\">\n          <div style=\"background:var(--surface-base);padding:var(--space-6) var(--space-7)\">\n            <h3 style=\"font-family:var(--font-head);font-weight:300;font-size:24px;margin:0 0 var(--space-2);color:var(--text-primary)\">What moved<\u002Fh3>\n            <p style=\"font-size:var(--text-label);color:var(--text-tertiary);margin:0 0 var(--space-5)\">Ranked by follower change over {{ deltaLabel }}. Comparable across every platform.<\u002Fp>\n            <sc-for list=\"{{ movers }}\" as=\"m\" hint-placeholder-count=\"4\">\n              <div style=\"display:flex;align-items:center;gap:var(--space-4);padding:var(--space-3) 0;border-bottom:1px solid var(--border-subtle)\">\n                <span style=\"{{ m.barStyle }}\"><\u002Fspan>\n                <span style=\"flex:1;min-width:0\">\n                  <span style=\"display:block;font-size:var(--text-body);color:var(--text-primary);font-weight:600\">{{ m.name }}<\u002Fspan>\n                  <span style=\"display:block;font-size:var(--text-micro);color:var(--text-tertiary)\">{{ m.platformLabel }} · {{ m.handle }}<\u002Fspan>\n                <\u002Fspan>\n                <span style=\"width:150px;height:8px;background:var(--surface-overlay);border-radius:var(--radius-pill);overflow:hidden;flex:none\">\n                  <span style=\"{{ m.fillStyle }}\"><\u002Fspan>\n                <\u002Fspan>\n                <span style=\"{{ m.deltaStyle }}\">{{ m.delta }}<\u002Fspan>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n\n          <div style=\"background:var(--surface-base);padding:var(--space-6) var(--space-7)\">\n            <div style=\"display:flex;align-items:baseline;justify-content:space-between;gap:var(--space-4);margin-bottom:var(--space-2)\">\n              <h3 style=\"font-family:var(--font-head);font-weight:300;font-size:24px;margin:0;color:var(--text-primary)\">Audience<\u002Fh3>\n              <span style=\"font-size:var(--text-micro);letter-spacing:var(--track-label);text-transform:uppercase;color:var(--avail-live);border:1px solid var(--border-default);border-radius:var(--radius-pill);padding:2px var(--space-2)\">Daily<\u002Fspan>\n            <\u002Fdiv>\n            <p style=\"font-size:var(--text-label);color:var(--text-tertiary);margin:0 0 var(--space-5)\">{{ f.historyNote }} — nothing before that exists to plot.<\u002Fp>\n            <svg sc-camel-view-box=\"0 0 640 200\" style=\"width:100%;height:auto;display:block;overflow:visible\">\n              <sc-for list=\"{{ audience.grid }}\" as=\"g\" hint-placeholder-count=\"4\">\n                <line x1=\"0\" y1=\"{{ g.y }}\" x2=\"640\" y2=\"{{ g.y }}\" stroke=\"var(--border-subtle)\" stroke-width=\"1\" vector-effect=\"non-scaling-stroke\"><\u002Fline>\n              <\u002Fsc-for>\n              <sc-for list=\"{{ audience.series }}\" as=\"s\" hint-placeholder-count=\"2\">\n                <path d=\"{{ s.area }}\" fill=\"{{ s.tint }}\" stroke=\"none\"><\u002Fpath>\n              <\u002Fsc-for>\n              <sc-for list=\"{{ audience.series }}\" as=\"s\" hint-placeholder-count=\"2\">\n                <path d=\"{{ s.line }}\" fill=\"none\" stroke=\"{{ s.color }}\" stroke-width=\"2\" stroke-linejoin=\"round\" vector-effect=\"non-scaling-stroke\"><\u002Fpath>\n              <\u002Fsc-for>\n            <\u002Fsvg>\n            <div style=\"display:flex;justify-content:space-between;margin-top:var(--space-2)\">\n              <sc-for list=\"{{ audience.xLabels }}\" as=\"x\" hint-placeholder-count=\"5\">\n                <span style=\"font-size:var(--text-micro);color:var(--text-tertiary);font-variant-numeric:tabular-nums\">{{ x }}<\u002Fspan>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n            <div style=\"display:flex;gap:var(--space-4);margin-top:var(--space-4)\">\n              <sc-for list=\"{{ audience.legend }}\" as=\"l\" hint-placeholder-count=\"2\">\n                <span style=\"display:inline-flex;align-items:center;gap:var(--space-2);font-size:var(--text-label);color:var(--text-secondary)\"><span style=\"{{ l.dotStyle }}\"><\u002Fspan>{{ l.label }} <span style=\"color:var(--text-tertiary);font-variant-numeric:tabular-nums\">{{ l.value }}<\u002Fspan><\u002Fspan>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <div style=\"padding:var(--space-6) var(--space-7);border-top:1px solid var(--border-subtle);background:var(--surface-raised)\">\n          <h3 style=\"font-family:var(--font-head);font-weight:300;font-size:24px;margin:0 0 var(--space-2);color:var(--text-primary)\">What we can and can't see<\u002Fh3>\n          <p style=\"font-size:var(--text-label);color:var(--text-tertiary);margin:0 0 var(--space-5);max-width:76ch\">Each platform answers a different set of questions. This is the contract, not a backlog — where it says never, the API has no such endpoint.<\u002Fp>\n          <div style=\"display:grid;grid-template-columns:repeat(2,1fr);gap:var(--space-5) var(--space-7)\">\n            <sc-for list=\"{{ availProse }}\" as=\"p\" hint-placeholder-count=\"4\">\n              <div style=\"{{ p.wrapStyle }}\">\n                <div style=\"display:flex;align-items:center;gap:var(--space-3);margin-bottom:var(--space-3)\">\n                  <span style=\"{{ p.pillStyle }}\">{{ p.platformLabel }}<\u002Fspan>\n                  <span style=\"{{ p.statusStyle }}\">{{ p.status }}<\u002Fspan>\n                <\u002Fdiv>\n                <p style=\"font-size:var(--text-body);line-height:1.62;color:var(--text-secondary);margin:0;text-wrap:pretty\">{{ p.text }}<\u002Fp>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <div style=\"padding:var(--space-6) var(--space-7);border-top:1px solid var(--border-subtle)\">\n          <div style=\"display:flex;align-items:baseline;justify-content:space-between;gap:var(--space-4);margin-bottom:var(--space-5)\">\n            <h3 style=\"font-family:var(--font-head);font-weight:300;font-size:24px;margin:0;color:var(--text-primary)\">Recent posts<\u002Fh3>\n            <span style=\"font-size:var(--text-micro);letter-spacing:var(--track-label);text-transform:uppercase;color:var(--text-tertiary)\">Engagement rate is comparable · views are not<\u002Fspan>\n          <\u002Fdiv>\n          <sc-for list=\"{{ posts }}\" as=\"p\" hint-placeholder-count=\"6\">\n            <div style=\"display:flex;align-items:center;gap:var(--space-5);padding:var(--space-4) 0;border-bottom:1px solid var(--border-subtle)\">\n              <span style=\"{{ p.thumbLargeStyle }}\"><\u002Fspan>\n              <span style=\"flex:1;min-width:0\">\n                <span style=\"display:block;font-family:var(--font-head);font-weight:300;font-size:var(--figure-sm);color:var(--text-primary);overflow:hidden;text-overflow:ellipsis;white-space:nowrap\">{{ p.title }}<\u002Fspan>\n                <span style=\"display:flex;align-items:center;gap:var(--space-3);margin-top:var(--space-2)\">\n                  <span style=\"{{ p.pillStyle }}\">{{ p.platformLabel }}<\u002Fspan>\n                  <span style=\"font-size:var(--text-label);color:var(--text-tertiary)\">{{ p.account }} · {{ p.published }}<\u002Fspan>\n                <\u002Fspan>\n              <\u002Fspan>\n              <span style=\"text-align:right;flex:none;width:110px\">\n                <span style=\"display:block;font-family:var(--font-head);font-weight:300;font-size:var(--figure-sm);color:var(--text-primary);font-variant-numeric:tabular-nums\">{{ p.eng }}<\u002Fspan>\n                <span style=\"display:block;font-size:var(--text-micro);letter-spacing:var(--track-label);text-transform:uppercase;color:var(--text-tertiary)\">Engagement<\u002Fspan>\n              <\u002Fspan>\n              <span style=\"text-align:right;flex:none;width:110px\">\n                <span style=\"display:block;font-family:var(--font-head);font-weight:300;font-size:var(--figure-sm);color:var(--text-secondary);font-variant-numeric:tabular-nums\">{{ p.views }}<\u002Fspan>\n                <span style=\"display:block;font-size:var(--text-micro);letter-spacing:var(--track-label);text-transform:uppercase;color:var(--text-tertiary)\">Views<\u002Fspan>\n              <\u002Fspan>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div style=\"display:grid;grid-template-columns:1fr 1fr 1fr;gap:var(--space-5);margin-top:var(--space-5)\">\n        <div><p style=\"font-size:var(--text-micro);letter-spacing:var(--track-label);text-transform:uppercase;color:var(--brand-gold);margin:0 0 var(--space-2)\">Strength<\u002Fp><p style=\"font-size:var(--text-label);line-height:1.6;color:var(--text-secondary);margin:0\">Best answer to R3. Week one reads as a story rather than a mostly-empty dashboard, and the prose makes the gaps genuinely legible.<\u002Fp><\u002Fdiv>\n        <div><p style=\"font-size:var(--text-micro);letter-spacing:var(--track-label);text-transform:uppercase;color:var(--brand-gold);margin:0 0 var(--space-2)\">Cost<\u002Fp><p style=\"font-size:var(--text-label);line-height:1.6;color:var(-
