-text-secondary);margin:0\">The lede is generated copy — it needs rules for every data shape, including \"nothing moved\". More scrolling per answer.<\u002Fp><\u002Fdiv>\n        <div><p style=\"font-size:var(--text-micro);letter-spacing:var(--track-label);text-transform:uppercase;color:var(--brand-gold);margin:0 0 var(--space-2)\">Flag<\u002Fp><p style=\"font-size:var(--text-label);line-height:1.6;color:var(--text-secondary);margin:0\">Needs no new views — the lede is composed client-side from the five existing ones.<\u002Fp><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <!-- ============================== 1c · BOARD ============================== -->\n    <div id=\"1c\" style=\"width:1280px;flex:none\">\n      <div style=\"display:flex;align-items:baseline;gap:var(--space-3);margin:0 0 var(--space-2)\">\n        <span style=\"font-family:var(--font-body);font-weight:600;font-size:var(--text-label);letter-spacing:var(--track-label);color:var(--text-on-accent);background:var(--brand-gold);border-radius:var(--radius-sm);padding:2px var(--space-2)\">1c<\u002Fspan>\n        <h2 style=\"font-family:var(--font-head);font-weight:300;font-size:32px;letter-spacing:-0.01em;margin:0;color:var(--text-primary)\">Board<\u002Fh2>\n        <span style=\"font-size:var(--text-label);color:var(--text-tertiary)\">Left rail · platform → account is structural<\u002Fspan>\n      <\u002Fdiv>\n      <p style=\"font-size:var(--text-body);line-height:1.6;color:var(--text-secondary);margin:0 0 var(--space-5);max-width:88ch\">Bets that R1 should be navigation, not a filter control. The rail is the hierarchy — platform, then account — so you can never wonder which scope you're in: the selected node is lit and the breadcrumb repeats it. Unconnected platforms stay visible and dimmed, which turns the nav itself into part of the availability story.<\u002Fp>\n\n      <div style=\"border:1px solid var(--border-default);border-radius:var(--radius-lg);overflow:hidden;background:var(--surface-base);box-shadow:var(--shadow-overlay);display:grid;grid-template-columns:248px 1fr\">\n\n        <div style=\"background:var(--surface-raised);border-right:1px solid var(--border-subtle);display:flex;flex-direction:column;min-height:1180px\">\n          <div style=\"display:flex;align-items:center;gap:var(--space-3);padding:var(--space-5)\">\n            <svg sc-camel-view-box=\"0 0 32 32\" style=\"width:18px;height:18px;flex:none\" aria-hidden=\"true\"><circle cx=\"16\" cy=\"16\" r=\"9\" fill=\"none\" stroke=\"var(--brand-peri)\" stroke-width=\"2\"><\u002Fcircle><circle cx=\"16\" cy=\"7\" r=\"2.6\" fill=\"var(--brand-gold)\"><\u002Fcircle><\u002Fsvg>\n            <span style=\"font-family:var(--font-display);font-size:15px;letter-spacing:var(--track-display);color:var(--text-primary)\">SIGNAL<\u002Fspan>\n          <\u002Fdiv>\n          <div style=\"padding:0 var(--space-3)\">\n            <sc-for list=\"{{ rail }}\" as=\"n\" hint-placeholder-count=\"8\">\n              <div style=\"{{ n.rowStyle }}\">\n                <span style=\"{{ n.dotStyle }}\"><\u002Fspan>\n                <span style=\"flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap\">{{ n.label }}<\u002Fspan>\n                <span style=\"{{ n.metaStyle }}\">{{ n.meta }}<\u002Fspan>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n          <div style=\"flex:1\"><\u002Fdiv>\n          <div style=\"padding:var(--space-5);border-top:1px solid var(--border-subtle)\">\n            <div style=\"display:flex;align-items:center;gap:var(--space-2);margin-bottom:var(--space-2)\">\n              <span style=\"width:6px;height:6px;border-radius:50%;background:var(--state-positive);animation:sigPulse 2.4s ease-in-out infinite\"><\u002Fspan>\n              <span style=\"font-size:var(--text-micro);letter-spacing:var(--track-label);text-transform:uppercase;color:var(--text-tertiary)\">Synced {{ f.syncedAgo }}<\u002Fspan>\n            <\u002Fdiv>\n            <p style=\"font-size:var(--text-micro);color:var(--text-tertiary);margin:0 0 var(--space-4);line-height:1.5\">Daily at {{ f.syncedAt }}. Next run {{ f.nextRun }}.<\u002Fp>\n            <div style=\"display:block;text-align:center;font-size:var(--text-label);font-weight:600;color:var(--text-on-accent);background:var(--brand-peri);border-radius:var(--radius-md);padding:var(--space-3)\">Sync now<\u002Fdiv>\n            <div style=\"display:block;text-align:center;font-size:var(--text-label);color:var(--text-secondary);border:1px solid var(--border-default);border-radius:var(--radius-md);padding:var(--space-3);margin-top:var(--space-2)\">Connect account<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <div>\n          <div style=\"display:flex;align-items:center;gap:var(--space-4);padding:var(--space-4) var(--space-5);border-bottom:1px solid var(--border-subtle);background:var(--surface-raised)\">\n            <div>\n              <div style=\"font-size:var(--text-micro);letter-spacing:var(--track-label);text-transform:uppercase;color:var(--text-tertiary);margin-bottom:2px\">Scope<\u002Fdiv>\n              <div style=\"display:flex;align-items:center;gap:var(--space-2);font-size:var(--text-lead);color:var(--text-primary)\">\n                <span style=\"font-family:var(--font-head);font-weight:300;font-size:var(--figure-sm)\">Overview<\u002Fspan>\n                <span style=\"font-size:var(--text-label);color:var(--text-tertiary)\">· all platforms · all accounts<\u002Fspan>\n              <\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"flex:1\"><\u002Fdiv>\n            <div style=\"display:flex;gap:2px;background:var(--surface-sunken);border:1px solid var(--border-subtle);border-radius:var(--radius-md);padding:3px\">\n              <span style=\"font-size:var(--text-label);color:var(--text-tertiary);padding:3px var(--space-3);border-radius:var(--radius-sm)\">7d<\u002Fspan>\n              <span style=\"font-size:var(--text-label);color:var(--text-primary);background:var(--surface-overlay);padding:3px var(--space-3);border-radius:var(--radius-sm)\">30d<\u002Fspan>\n              <span style=\"font-size:var(--text-label);color:var(--text-tertiary);padding:3px var(--space-3);border-radius:var(--radius-sm)\">90d<\u002Fspan>\n            <\u002Fdiv>\n            <span style=\"font-size:var(--text-label);color:var(--text-tertiary)\">Sign out<\u002Fspan>\n          <\u002Fdiv>\n\n          <div style=\"padding:var(--space-5);display:flex;flex-direction:column;gap:var(--space-4)\">\n\n            <div style=\"display:grid;grid-template-columns:repeat(4,1fr);gap:var(--space-4)\">\n              <sc-for list=\"{{ kpiCards }}\" as=\"k\" hint-placeholder-count=\"4\">\n                <div style=\"background:var(--surface-raised);border:1px solid var(--border-subtle);border-radius:var(--radius-lg);padding:var(--space-5);box-shadow:var(--shadow-panel)\">\n                  <div style=\"font-size:var(--text-micro);letter-spacing:var(--track-label);text-transform:uppercase;color:var(--text-tertiary);margin-bottom:var(--space-3)\">{{ k.label }}<\u002Fdiv>\n                  <div style=\"font-family:var(--font-head);font-weight:300;font-size:var(--figure-lg);line-height:1;letter-spacing:-0.02em;color:var(--text-primary);font-variant-numeric:tabular-nums\">{{ k.value }}<\u002Fdiv>\n                  <div style=\"{{ k.subStyle }}\">{{ k.sub }}<\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n\n            <div style=\"display:grid;grid-template-columns:1.55fr 1fr;gap:var(--space-4)\">\n              <div style=\"background:var(--surface-raised);border:1px solid var(--border-subtle);border-radius:var(--radius-lg);padding:var(--space-5);box-shadow:var(--shadow-panel)\">\n                <div style=\"display:flex;align-items:baseline;justify-content:space-between;gap:var(--space-4);margin-bottom:var(--space-1)\">\n                  <h3 style=\"font-family:var(--font-head);font-weight:300;font-size:var(--figure-sm);margin:0;color:var(--text-primary)\">Audience<\u002Fh3>\n                  <span style=\"font-size:var(--text-micro);letter-spacing:var(--track-label);text-transform:uppercase;color:var(--avail-live);border:1px solid var(--border-default);border-radius:var(--radius-pill);padding:2px var(--space-2)\">Daily · from connection<\u002Fspan>\n                <\u002Fdiv>\n                <p style=\"font-size:var(--text-label);color:var(--text-tertiary);margin:0 0 var(--space-4)\">Pick an account in the rail to narrow every panel on this page.<\u002Fp>\n                <svg sc-camel-view-box=\"0 0 640 200\" style=\"width:100%;height:auto;display:block;overflow:visible\">\n                  <sc-for list=\"{{ audience.grid }}\" as=\"g\" hint-placeholder-count=\"4\">\n                    <line x1=\"0\" y1=\"{{ g.y }}\" x2=\"640\" y2=\"{{ g.y }}\" stroke=\"var(--border-subtle)\" stroke-width=\"1\" vector-effect=\"non-scaling-stroke\"><\u002Fline>\n                  <\u002Fsc-for>\n                  <sc-for list=\"{{ audience.series }}\" as=\"s\" hint-placeholder-count=\"2\">\n                    <path d=\"{{ s.area }}\" fill=\"{{ s.tint }}\" stroke=\"none\"><\u002Fpath>\n                  <\u002Fsc-for>\n                  <sc-for list=\"{{ audience.series }}\" as=\"s\" hint-placeholder-count=\"2\">\n                    <path d=\"{{ s.line }}\" fill=\"none\" stroke=\"{{ s.color }}\" stroke-width=\"2\" stroke-linejoin=\"round\" vector-effect=\"non-scaling-stroke\"><\u002Fpath>\n                  <\u002Fsc-for>\n                <\u002Fsvg>\n                <div style=\"display:flex;justify-content:space-between;margin-top:var(--space-2)\">\n                  <sc-for list=\"{{ audience.xLabels }}\" as=\"x\" hint-placeholder-count=\"5\">\n                    <span style=\"font-size:var(--text-micro);color:var(--text-tertiary);font-variant-numeric:tabular-nums\">{{ x }}<\u002Fspan>\n                  <\u002Fsc-for>\n                <\u002Fdiv>\n              <\u002Fdiv>\n\n              <div style=\"background:var(--surface-raised);border:1px solid var(--border-subtle);border-radius:var(--radius-lg);padding:var(--space-5);box-shadow:var(--shadow-panel)\">\n                <h3 style=\"font-family:var(--font-head);font-weight:300;font-size:var(--figure-sm);margin:0 0 var(--space-1);color:var(--text-primary)\">Daily activity<\u002Fh3>\n                <p style=\"font-size:var(--text-label);color:var(--text-tertiary);margin:0 0 var(--space-4)\">Two different series, because the platforms measure different things.<\u002Fp>\n                <div style=\"display:flex;align-items:center;justify-content:space-between;margin-bottom:var(--space-2)\">\n                  <span style=\"display:inline-flex;align-items:center;gap:var(--space-2);font-size:var(--text-label);color:var(--text-secondary)\"><span style=\"width:8px;height:8px;border-radius:2px;background:var(--data-youtube)\"><\u002Fspan>YouTube views<\u002Fspan>\n                  <span style=\"font-size:var(--text-micro);letter-spacing:var(--track-label);text-transform:uppercase;color:var(--avail-lagged)\">Lags 2–3d<\u002Fspan>\n                <\u002Fdiv>\n                <svg sc-camel-view-box=\"0 0 400 90\" style=\"width:100%;height:auto;display:block\">\n                  <sc-for list=\"{{ ytBars }}\" as=\"b\" hint-placeholder-count=\"8\">\n                    <rect x=\"{{ b.x }}\" y=\"{{ b.y }}\" width=\"{{ b.w }}\" height=\"{{ b.h }}\" rx=\"2\" fill=\"var(--data-youtube)\"><\u002Frect>\n                  <\u002Fsc-for>\n                <\u002Fsvg>\n                <div style=\"display:flex;align-items:center;justify-content:space-between;margin:var(--space-5) 0 var(--space-2)\">\n                  <span style=\"display:inline-flex;align-items:center;gap:var(--space-2);font-size:var(--text-label);color:var(--text-secondary)\"><span style=\"width:8px;height:8px;border-radius:50%;background:var(--data-instagram)\"><\u002Fspan>Instagram reach<\u002Fspan>\n                  <span style=\"font-size:var(--text-micro);letter-spacing:var(--track-label);text-transform:uppercase;color:var(--avail-live)\">Daily<\u002Fspan>\n                <\u002Fdiv>\n                <svg sc-camel-view-box=\"0 0 400 90\" style=\"width:100%;height:auto;display:block;overflow:visible\">\n                  <path d=\"{{ igReach.area }}\" fill=\"var(--data-instagram-tint)\" stroke=\"none\"><\u002Fpath>\n                  <path d=\"{{ igReach.line }}\" fill=\"none\" stroke=\"var(--data-instagram)\" stroke-width=\"2\" vector-effect=\"non-scaling-stroke\"><\u002Fpath>\n                <\u002Fsvg>\n                <p style=\"font-size:var(--text-micro);line-height:1.55;color:var(--text-tertiary);margin:var(--space-4) 0 0;padding-top:var(--space-3);border-top:1px solid var(--border-subtle)\">Instagram has no daily views series and never will on this API — reach is the only per-day figure it returns.<\u002Fp>\n              <\u002Fdiv>\n            <\u002Fdiv>\n\n            <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:var(--space-4)\">\n              <div style=\"background:var(--surface-raised);border:1px solid var(--border-subtle);border-radius:var(--radius-lg);padding:var(--space-5);box-shadow:var(--shadow-panel)\">\n                <h3 style=\"font-family:var(--font-head);font-weight:300;font-size:var(--figure-sm);margin:0 0 var(--space-1);color:var(--text-primary)\">Accounts<\u002Fh3>\n                <p style=\"font-size:var(--text-label);color:var(--text-tertiary);margin:0 0 var(--space-4)\">Each card opens that account's filtered view.<\u002Fp>\n                <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:var(--space-3)\">\n                  <sc-for list=\"{{ accounts }}\" as=\"a\" hint-placeholder-count=\"4\">\n                    <div style=\"{{ a.cardStyle }}\">\n                      <div style=\"display:flex;align-items:center;gap:var(--space-2);margin-bottom:var(--space-3)\">\n                        <span style=\"{{ a.pillStyle }}\">{{ a.platformLabel }}<\u002Fspan>\n                      <\u002Fdiv>\n                      <div style=\"font-size:var(--text-body);font-weight:600;color:var(--text-primary);overflow:hidden;text-overflow:ellipsis;white-space:nowrap\">{{ a.name }}<\u002Fdiv>\n                      <div style=\"font-size:var(--text-micro);color:var(--text-tertiary);margin-bottom:var(--space-3)\">{{ a.handle }}<\u002Fdiv>\n                      <div style=\"display:flex;align-items:baseline;gap:var(--space-2)\">\n                        <span style=\"font-family:var(--font-head);font-weight:300;font-size:var(--figure-sm);color:var(--text-primary);font-variant-numeric:tabular-nums\">{{ a.followers }}<\u002Fspan>\n                        <span style=\"{{ a.deltaInlineStyle }}\">{{ a.delta }}<\u002Fspan>\n                      <\u002Fdiv>\n                      <div style=\"font-size:var(--text-micro);color:var(--text-tertiary);margin-top:var(--space-1)\">{{ a.posts }} posts · as of {{ a.asOf }}<\u002Fdiv>\n                    <\u002Fdiv>\n                  <\u002Fsc-for>\n                <\u002Fdiv>\n              <\u002Fdiv>\n\n              <div style=\"background:var(--surface-raised);border:1px solid var(--border-subtle);border-radius:var(--radius-lg);padding:var(--space-5);box-shadow:var(--shadow-panel)\">\n                <h3 style=\"font-family:var(--font-head);font-weight:300;font-size:var(--figure-sm);margin:0 0 var(--space-1);color:var(--text-primary)\">Availability<\u002Fh3>\n                <p style=\"font-size:var(--text-label);color:var(--text-tertiary);margin:0 0 var(--space-4)\">Docked, always on. A hollow ring is the API's answer; terracotta is ours.<\u002Fp>\n                <div style=\"display:grid;grid-template-columns:1.5fr repeat({{ availColCount }},1fr);font-size:var(--text-label)\">\n                  <div style=\"border-bottom:1px solid var(--border-default);padding:0 0 var(--space-2)\"><\u002Fdiv>\n                  <sc-for list=\"{{ availCols }}\" as=\"c\" hint-placeholder-count=\"4\">\n                    <div style=\"{{ c.headStyle }}\">{{ c.short }}<\u002Fdiv>\n                  <\u002Fsc-for>\n                  <sc-for list=\"{{ availRows }}\" as=\"r\" hint-placeholder-count=\"8\">\n                    <div style=\"padding:var(--space-2) var(--space-3) var(--space-2) 0;border-bottom:1px solid var(--border-subtle);color:var(--text-secondary);white-space:nowrap\">{{ r.metric }}<\u002Fdiv>\n                    <sc-for list=\"{{ r.cells }}\" as=\"c\" hint-placeholder-count=\"4\">\n                      <div style=\"padding:var(--space-2) 0;border-bottom:1px solid var(--border-subtle);display:flex;align-items:center;justify-content:center\" title=\"{{ c.title }}\">\n                        <span style=\"{{ c.glyphStyle }}\"><\u002Fspan>\n                      <\u002Fdiv>\n                    <\u002Fsc-for>\n                  <\u002Fsc-for>\n                <\u002Fdiv>\n                <div style=\"display:flex;flex-wrap:wrap;gap:var(--space-3);margin-top:var(--space-4);padding-top:var(--space-3);border-top:1px solid var(--border-subtle)\">\n                  <sc-for list=\"{{ availLegend }}\" as=\"l\" hint-placeholder-count=\"6\">\n                    <span style=\"display:inline-flex;align-items:center;gap:var(--space-2);font-size:var(--text-micro);color:var(--text-tertiary)\"><span style=\"{{ l.glyphStyle }}\"><\u002Fspan>{{ l.label }}<\u002Fspan>\n                  <\u002Fsc-for>\n                <\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n\n            <div style=\"background:var(--surface-raised);border:1px solid var(--border-subtle);border-radius:var(--radius-lg);padding:var(--space-5);box-shadow:var(--shadow-panel)\">\n              <div style=\"display:flex;align-items:baseline;justify-content:space-between;gap:var(--space-4);margin-bottom:var(--space-4)\">\n                <h3 style=\"font-family:var(--font-head);font-weight:300;font-size:var(--figure-sm);margin:0;color:var(--text-primary)\">Posts<\u002Fh3>\n                <div style=\"display:flex;gap:var(--space-2)\">\n                  <span style=\"font-size:var(--text-micro);letter-spacing:var(--track-label);text-transform:uppercase;color:var(--text-primary);border:1px solid var(--border-strong);border-radius:var(--radius-pill);padding:2px var(--space-3)\">All types<\u002Fspan>\n                  <span style=\"font-size:var(--text-micro);letter-spacing:var(--track-label);text-transform:uppercase;color:var(--text-tertiary);border:1px solid var(--border-default);border-radius:var(--radius-pill);padding:2px var(--space-3)\">Video<\u002Fspan>\n                  <span style=\"font-size:var(--text-micro);letter-spacing:var(--track-label);text-transform:uppercase;color:var(--text-tertiary);border:1px solid var(--border-default);border-radius:var(--radius-pill);padding:2px var(--space-3)\">Short / Reel<\u002Fspan>\n                <\u002Fdiv>\n              <\u002Fdiv>\n              <div style=\"display:grid;grid-template-columns:56px 96px 1.6fr 90px 80px 80px 90px;font-size:var(--text-micro);letter-spacing:var(--track-label);text-transform:uppercase;color:var(--text-tertiary);border-bottom:1px solid var(--border-default);padding-bottom:var(--space-2)\">\n                <span><\u002Fspan><span>Platform<\u002Fspan><span>Title<\u002Fspan><span style=\"text-align:right\">Published<\u002Fspan><span style=\"text-align:right\">Views<\u002Fspan><span style=\"text-align:right\">Likes<\u002Fspan><span style=\"text-align:right\">Eng %<\u002Fspan>\n              <\u002Fdiv>\n              <sc-for list=\"{{ posts }}\" as=\"p\" hint-placeholder-count=\"6\">\n                <div style=\"display:grid;grid-template-columns:56px 96px 1.6fr 90px 80px 80px 90px;align-items:center;padding:var(--space-2) 0;border-bottom:1px solid var(--border-subtle);font-size:var(--text-body)\">\n                  <span style=\"{{ p.thumbStyle }}\"><\u002Fspan>\n                  <span><span style=\"{{ p.pillStyle }}\">{{ p.platformLabel }}<\u002Fspan><\u002Fspan>\n                  <span style=\"min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--text-primary)\">{{ p.title }} <span style=\"color:var(--text-tertiary)\">· {{ p.account }}<\u002Fspan><\u002Fspan>\n                  <span style=\"text-align:right;color:var(--text-tertiary);font-variant-numeric:tabular-nums;font-size:var(--text-label)\">{{ p.published }}<\u002Fspan>\n                  <span style=\"text-align:right;font-variant-numeric:tabular-nums;color:var(--text-secondary)\">{{ p.views }}<\u002Fspan>\n                  <span style=\"text-align:right;font-variant-numeric:tabular-nums;color:var(--text-secondary)\">{{ p.likes }}<\u002Fspan>\n                  <span style=\"text-align:right;font-variant-numeric:tabular-nums;color:var(--text-primary)\">{{ p.eng }}<\u002Fspan>\n                <\u002Fdiv>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div style=\"display:grid;grid-template-columns:1fr 1fr 1fr;gap:var(--space-5);margin-top:var(--space-5)\">\n        <div><p style=\"font-size:var(--text-micro);letter-spacing:var(--track-label);text-transform:uppercase;color:var(--brand-gold);margin:0 0 var(--space-2)\">Strength<\u002Fp><p style=\"font-size:var(--text-label);line-height:1.6;color:var(--text-secondary);margin:0\">Strongest answer to R1 — scope is a place you navigate to, so it survives refresh and links naturally. Unconnected platforms teach by staying visible.<\u002Fp><\u002Fdiv>\n        <div><p style=\"font-size:var(--text-micro);letter-spacing:var(--track-label);text-transform:uppercase;color:var(--brand-gold);margin:0 0 var(--space-2)\">Cost<\u002Fp><p style=\"font-size:var(--text-label);line-height:1.6;color:var(--text-secondary);margin:0\">A 248px rail for five accounts is generous, and it's the biggest departure from what's built today.<\u002Fp><\u002Fdiv>\n        <div><p style=\"font-size:var(--text-micro);letter-spacing:var(--track-label);text-transform:uppercase;color:var(--brand-gold);margin:0 0 var(--space-2)\">URL scheme<\u002Fp><p style=\"font-size:var(--text-label);line-height:1.6;color:var(--text-secondary);margin:0\"><code style=\"font-family:ui-monospace,monospace;font-size:var(--text-micro)\">/instagram/ccproductions?range=30<\u002Fcode> — path is scope, query is view state.<\u002Fp><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <!-- ============================== TOKEN SHEET ============================== -->\n  <sc-if value=\"{{ showTokens }}\" hint-placeholder-val=\"{{ true }}\">\n  <div style=\"margin-top:var(--space-8);padding-top:var(--space-7);border-top:1px solid var(--canvas-rule)\">\n    <h2 style=\"font-family:var(--font-head);font-weight:300;font-size:34px;margin:0 0 var(--space-3);color:var(--text-primary)\">Token sheet<\u002Fh2>\n    <p style=\"font-size:var(--text-body);line-height:1.62;color:var(--text-secondary);margin:0 0 var(--space-6);max-width:80ch\">Semantic names, one layer above the brand palette — components reference these, never a hex. The raw brand values are bound once at the top so a palette change is a one-line edit. This is the sheet the code pass binds to CSS custom properties; the prototypes already use exactly these names.<\u002Fp>\n\n    <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:var(--space-6)\">\n      <sc-for list=\"{{ tokenGroups }}\" as=\"g\" hint-placeholder-count=\"6\">\n        <div>\n          <p style=\"font-size:var(--text-micro);letter-spacing:0.18em;text-transform:uppercase;color:var(--brand-gold);margin:0 0 var(--space-2)\">{{ g.title }}<\u002Fp>\n          <p style=\"font-size:var(--text-label);line-height:1.55;color:var(--text-tertiary);margin:0 0 var(--space-4)\">{{ g.note }}<\u002Fp>\n          <sc-for list=\"{{ g.rows }}\" as=\"t\" hint-placeholder-count=\"5\">\n            <div style=\"display:flex;align-items:center;gap:var(--space-3);padding:var(--space-2) 0;border-bottom:1px solid var(--canvas-rule)\">\n              <span style=\"{{ t.swatchStyle }}\"><\u002Fspan>\n              <code style=\"flex:1;font-family:ui-monospace,SFMono-Regular,monospace;font-size:var(--text-label);color:var(--text-secondary)\">{{ t.name }}<\u002Fcode>\n              <code style=\"font-family:ui-monospace,SFMono-Regular,monospace;font-size:var(--text-micro);color:var(--text-tertiary)\">{{ t.value }}<\u002Fcode>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n\n    <div style=\"margin-top:var(--space-7);padding-top:var(--space-6);border-top:1px solid var(--canvas-rule);display:grid;grid-template-columns:repeat(auto-fit,minmax(330px,1fr));gap:var(--space-6)\">\n      <div>\n        <p style=\"font-size:var(--text-micro);letter-spacing:0.18em;text-transform:uppercase;color:var(--brand-gold);margin:0 0 var(--space-3)\">Handoff — structural vs decorative<\u002Fp>\n        <p style=\"font-size:var(--text-label);line-height:1.62;color:var(--text-secondary);margin:0 0 var(--space-3)\"><strong style=\"color:var(--text-primary)\">Structural:<\u002Fstrong> the availability glyph set, cadence badges, the freshness strip, delta colouring, platform pills, the KPI/panel grid. These are components and should be built once.<\u002Fp>\n        <p style=\"font-size:var(--text-label);line-height:1.62;color:var(--text-secondary);margin:0\"><strong style=\"color:var(--text-primary)\">Decorative:<\u002Fstrong> panel radius, shadow depth, the pulse on the live dot, area-fill tints. Safe to tune without touching behaviour.<\u002Fp>\n      <\u002Fdiv>\n      <div>\n        <p style=\"font-size:var(--text-micro);letter-spacing:0.18em;text-transform:uppercase;color:var(--brand-gold);margin:0 0 var(--space-3)\">Handoff — no new views needed<\u002Fp>\n        <p style=\"font-size:var(--text-label);line-height:1.62;color:var(--text-secondary);margin:0\">All three directions read only the five existing views. The availability matrix is a static description of the contract, not a query — it belongs in the frontend as a constant, versioned next to the collectors so it can't drift silently from what they actually fetch.<\u002Fp>\n      <\u002Fdiv>\n      <div>\n        <p style=\"font-size:var(--text-micro);letter-spacing:0.18em;text-transform:uppercase;color:var(--brand-gold);margin:0 0 var(--space-3)\">Flags for Demetri<\u002Fp>\n        <p style=\"font-size:var(--text-label);line-height:1.62;color:var(--text-secondary);margin:0 0 var(--space-3)\">All four brand fonts are in this project — the code pass can take them straight from here, contrary to the README note that they exist nowhere.<\u002Fp>\n        <p style=\"font-size:var(--text-label);line-height:1.62;color:var(--text-secondary);margin:0\">Figures shown are modelled on the described real shape (four accounts, 42 posts vs 4, YouTube ending 13 Aug, all Instagram accounts below the 100-follower threshold). Wiring to the live views is the next step, not a redesign.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <\u002Fsc-if>\n<\u002Fsection>\n\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;dataState&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;Week one&quot;,&quot;Two years in&quot;],&quot;default&quot;:&quot;Week one&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Data&quot;},&quot;deltaWindow&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;7 days&quot;,&quot;28 days&quot;],&quot;default&quot;:&quot;7 days&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Data&quot;},&quot;showTokenSheet&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Gallery&quot;}}\">\nclass Component extends DCLogic {\n  PLAT = {\n    youtube:   { label:'YouTube',   short:'YT', color:'var(--data-youtube)',   tint:'var(--data-youtube-tint)' },\n    instagram: { label:'Instagram', short:'IG', color:'var(--data-instagram)', tint:'var(--data-instagram-tint)' },\n    tiktok:    { label:'TikTok',    short:'TT', color:'var(--data-tiktok)',    tint:'var(--data-tiktok-tint)' },\n    facebook:  { label:'Facebook',  short:'FB', color:'var(--data-facebook)',  tint:'var(--data-facebook-tint)' }\n  };\n\n  RAW = { youtube:'255,78,69', instagram:'225,71,126', tiktok:'37,229,208', facebook:'74,140,255' };\n\n  state = { scope: { kind:'all' } };\n  setScope = (scope) => this.setState({ scope });\n\n  // One chart builder shared by every scope — series are already resolved to\n  // {label, rgb, opacity, values} so the caller decides platform vs account grouping.\n  makeChart(list, days) {\n    const W = 640, H = 200, PAD = 8;\n    const n = days.length;\n    const all = list.flatMap((s) => s.values);\n    const min = Math.min(...all), max = Math.max(...all);\n    const span = (max - min) || 1;\n    const X = (i) => PAD + (i * (W - PAD * 2)) / (n - 1);\n    const Y = (v) => (H - PAD) - ((v - min) / span) * (H - PAD * 2);\n    return {\n      grid: [0,1,2,3].map((i) => ({ y: (PAD + i * ((H - PAD * 2) / 3)).toFixed(1) })),\n      series: list.map((s) => {\n        let d = '';\n        s.values.forEach((v, i) => { d += (i ? 'L' : 'M') + X(i).toFixed(1) + ' ' + Y(v).toFixed(1) + ' '; });\n        return {\n          line: d.trim(),\n          area: d + 'L' + X(n - 1).toFixed(1) + ' ' + (H - PAD) + ' L' + X(0).toFixed(1) + ' ' + (H - PAD) + ' Z',\n          color: 'rgba(' + s.rgb + ',' + s.opacity + ')',\n          tint: 'rgba(' + s.rgb + ',' + (0.13 * s.opacity).toFixed(3) + ')'\n        };\n      }),\n      legend: list.map((s) => ({\n        label: s.label, value: this.fmt(s.values[n - 1]),\n        dotStyle: 'width:8px;height:8px;border-radius:50%;flex:none;background:rgba(' + s.rgb + ',' + s.opacity + ')'\n      })),\n      xLabels: [0, Math.floor((n - 1) / 3), Math.floor(2 * (n - 1) / 3), n - 1].map((i) => days[i])\n    };\n  }\n\n  PLATFORM_CAVEAT = {\n    youtube:'Analytics end {lag} — the API lags two to three days, so the last few days are legitimately blank. Watch time and daily views are YouTube-only; neither compares to anything else here.',\n    instagram:'Reach is the only daily series. Views, likes and saves arrive as one rolling 28-day total that cannot be split into days. Below 100 followers Meta returns no follower breakdown at all.',\n    tiktok:'Cumulative totals only — daily movement is derived by differencing snapshots, so it needs two days before it says anything and a missed sync folds two days into one.',\n    facebook:'No Page is connected, and Meta is actively retiring Page metrics. Treat anything here as provisional.'\n  };\n\n  fmt(n) {\n    if (n === null || n === undefined || Number.isNaN(Number(n))) return '—';\n    n = Number(n); const a = Math.abs(n);\n    if (a >= 1e9) return (n/1e9).toFixed(1).replace(/\\.0$/,'') + 'B';\n    if (a >= 1e6) return (n/1e6).toFixed(1).replace(/\\.0$/,'') + 'M';\n    if (a >= 1e4) return Math.round(n/1e3) + 'K';\n    return n.toLocaleString('en-GB');\n  }\n  signed(n) { return (n === null || n === undefined) ? '—' : (n > 0 ? '+' : '') + this.fmt(n); }\n\n  // Deterministic wobble so the mature fixture has texture without randomness.\n  genSeries(start, end, n, amp) {\n    const out = [];\n    for (let i = 0; i < n; i++) {\n      const t = i / (n - 1);\n      const w = Math.sin(i * 1.7) * amp + Math.sin(i * 0.6) * amp * 0.6;\n      out.push(Math.round(start + (end - start) * t + w));\n    }\n    out[0] = start; out[n - 1] = end;\n    return out;\n  }\n\n  dayLabels(endDay, endMonth, n) {\n    const months = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];\n    const d = new Date(Date.UTC(2026, endMonth, endDay));\n    const out = [];\n    for (let i = n - 1; i >= 0; i--) {\n      const x = new Date(d.getTime() - i * 86400000);\n      out.push(x.getUTCDate() + ' ' + months[x.getUTCMonth()]);\n    }\n    return out;\n  }\n\n  /* ---------------- fixtures ----------------\n     Shapes follow the data contract exactly: no Instagram daily views, YouTube\n     analytics lag their own snapshot, TikTok movement is derived, no Facebook Page. */\n  week1() {\n    return {\n      key: 'week1',\n      dateline: 'Sunday 16 August 2026',\n      historyNote: 'Connected 6 Aug · 11 days of history',\n      syncedAt: '03:15 UTC', syncedAgo: '12h ago', nextRun: '03:15 UTC',\n      ytLagEnds: '13 Aug',\n      days: this.dayLabels(16, 7, 11),\n      accounts: [\n        { p:'youtube',   name:'Life Storied',   handle:'@lifestoried',\n          series:[191,194,196,199,203,205,208,210,211,213,214], posts:42, asOf:'16 Aug' },\n        { p:'instagram', name:'Cunning Corp Productions', handle:'@ccproductions',\n          series:[82,84,85,87,88,90,91,92,93,94,94], posts:31, asOf:'16 Aug' },\n        { p:'instagram', name:'Aubrey North',   handle:'@aubreynorth',\n          series:[58,58,59,59,60,60,60,61,61,61,61], posts:12, asOf:'16 Aug' },\n        { p:'instagram', name:'Cunning Corp',   handle:'@cunningcorp',\n          series:[38,38,38,38,38,38,38,38,38,38,38], posts:4, asOf:'16 Aug' }\n      ],\n      ytViews: [420,510,380,640,720,560,690,610],\n      igReach: [310,290,340,420,380,360,410,395,430,405,440],\n      engagement: '4.8%', postsInRange: 11, cadence: '2.6 a week',\n      tiktokConnected: false,\n      posts: [\n        { p:'youtube',   title:'What a family archive is actually for', account:'Life Storied',   published:'12 Aug', views:1240, likes:86, eng:'7.9%' },\n        { p:'instagram', title:'Reel — on location, 6am',                   account:'Cunning Corp Productions', published:'15 Aug', views:840,  likes:71, eng:'9.5%' },\n        { p:'youtube',   title:'The Dropbox Read',                      account:'Life Storied',   published:'9 Aug',  views:610,  likes:44, eng:'8.0%' },\n        { p:'instagram', title:'Post — the cutting room',                   account:'Cunning Corp Productions', published:'11 Aug', views:390,  likes:28, eng:'7.9%' },\n        { p:'instagram', title:'We subtract until it\\u2019s true',      account:'Aubrey North',   published:'14 Aug', views:210,  likes:19, eng:'10.0%' },\n        { p:'instagram', title:'The bulb',                              account:'Cunning Corp',   published:'8 Aug',  views:120,  likes:9,  eng:'8.3%' }\n      ],\n      sync: [\n        { p:'youtube',   name:'Life Storied',   status:'ok',    when:'12h ago', msg:'' },\n        { p:'instagram', name:'Cunning Corp Productions', status:'ok',    when:'12h ago', msg:'' },\n        { p:'instagram', name:'Aubrey North',   status:'ok',    when:'12h ago', msg:'' },\n        { p:'instagram', name:'Cunning Corp',   status:'error', when:'12h ago', msg:'Media insights: (#10) permission not granted' }\n      ]\n    };\n  }\n\n  mature() {\n    const n = 30;\n    return {\n      key: 'mature',\n      dateline: 'Wednesday 16 August 2028',\n      historyNote: 'Two years of history',\n      syncedAt: '03:15 UTC', syncedAgo: '9h ago', nextRun: '03:15 UTC',\n      ytLagEnds: '13 Aug',\n      days: this.dayLabels(16, 7, n),\n      accounts: [\n        { p:'youtube',   name:'Life Storied',   handle:'@lifestoried',\n          series:this.genSeries(46180, 48200, n, 90), posts:604, asOf:'16 Aug' },\n        { p:'tiktok',    name:'Cunning Corp',   handle:'@cunningcorp',\n          series:this.genSeries(28900, 31200, n, 140), posts:240, asOf:'15 Aug' },\n        { p:'instagram', name:'Cunning Corp Productions', handle:'@ccproductions',\n          series:this.genSeries(20740, 21600, n, 60), posts:892, asOf:'16 Aug' },\n        { p:'instagram', name:'Aubrey North',   handle:'@aubreynorth',\n          series:this.genSeries(12010, 12400, n, 38), posts:410, asOf:'16 Aug' },\n        { p:'instagram', name:'Cunning Corp',   handle:'@cunningcorp',\n          series:this.genSeries(8240, 8100, n, 30), posts:288, asOf:'16 Aug' }\n      ],\n      ytViews: [42100,38400,51200,47800,44600,58300,49700,46200],\n      igReach: this.genSeries(18400, 22600, n, 900),\n      engagement: '5.6%', postsInRange: 34, cadence: '7.9 a week',\n      tiktokConnected: true,\n      posts: [\n        { p:'tiktok',    title:'The one that lands',                     account:'Cunning Corp',   published:'14 Aug', views:184000, likes:21400, eng:'12.4%' },\n        { p:'youtube',   title:'Two years of the family archive',        account:'Life Storied',   published:'11 Aug', views:96200,  likes:5840,  eng:'6.7%' },\n        { p:'instagram', title:'Reel — on location, two years on',         account:'Cunning Corp Productions', published:'15 Aug', views:41800,  likes:3920,  eng:'9.9%' },\n        { p:'youtube',   title:'Restraint is the craft',                 account:'Life Storied',   published:'6 Aug',  views:33400,  likes:1610,  eng:'5.2%' },\n        { p:'instagram', title:'We subtract until it\\u2019s true',       account:'Aubrey North',   published:'12 Aug', views:12600,  likes:1180,  eng:'9.7%' },\n        { p:'instagram', title:'The bulb, ten years on',                 account:'Cunning Corp',   published:'9 Aug',  views:7400,   likes:520,   eng:'7.4%' }\n      ],\n      sync: [\n        { p:'youtube',   name:'Life Storied',   status:'ok',      when:'9h ago', msg:'' },\n        { p:'tiktok',    name:'Cunning Corp',   status:'ok',      when:'9h ago', msg:'' },\n        { p:'instagram', name:'Cunning Corp Productions', status:'ok',      when:'9h ago', msg:'' },\n        { p:'instagram', name:'Aubrey North',   status:'running', when:'now',    msg:'Collecting post insights' },\n        { p:'instagram', name:'Cunning Corp',   status:'ok',      when:'9h ago', msg:'' }\n      ]\n    };\n  }\n\n  /* ---------------- availability contract ---------------- */\n  GLYPH = {\n    live:  'width:9px;height:9px;border-radius:50%;background:var(--avail-live);display:inline-block;flex:none',\n    lag:   'width:9px;height:9px;border-radius:50%;border:1.5px solid var(--avail-lagged);background:linear-gradient(90deg,var(--avail-lagged) 0 50%,transparent 50% 100%);display:inline-block;flex:none',\n    roll:  'width:9px;height:9px;border-radius:50%;background:var(--avail-rolling);display:inline-block;flex:none',\n    deriv: 'width:9px;height:9px;border-radius:50%;border:1.5px dashed var(--avail-rolling);background:transparent;display:inline-block;flex:none',\n    none:  'width:9px;height:9px;border-radius:50%;border:1px dashed var(--avail-absent);background:transparent;display:inline-block;flex:none',\n    err:   'width:9px;height:9px;border-radius:50%;background:var(--avail-error);display:inline-block;flex:none',\n    off:   'width:9px;height:1px;background:var(--border-strong);display:inline-block;flex:none'\n  };\n  GLYPH_TITLE = {\n    live:'Daily', lag:'Daily, lags 2–3 days', roll:'28-day rolling total',\n    deriv:'Derived by differencing snapshots', none:'Not provided by this API',\n    err:'Failing — see sync health', off:'Platform not connected'\n  };\n\n  availability(f) {\n    const tt = f.tiktokConnected;\n    const igDelta = f.key === 'week1' ? 'none' : 'roll';\n    const rows = [\n      ['Followers',            'live', 'live',    tt ? 'live'  : 'off', 'off'],\n      ['Follower change',      'live', igDelta,   tt ? 'deriv' : 'off', 'off'],\n      ['Posts & cadence',      'live', 'live',    tt ? 'live'  : 'off', 'off'],\n      ['Engagement rate',      'live', 'live',    tt ? 'live'  : 'off', 'off'],\n      ['Views — daily',        'lag',  'none',    tt ? 'deriv' : 'off', 'off'],\n      ['Reach — daily',        'none', 'live',    'none',              'off'],\n      ['Watch time',           'lag',  'none',    'none',              'off'],\n      ['Views — 28d rolling',  'none', 'roll',    'none',              'off']\n    ];\n    return rows.map(([metric, ...codes]) => ({\n      metric,\n      cells: codes.map((c) => ({\n        glyphStyle: this.GLYPH[c],\n        title: metric + ' — ' + this.GLYPH_TITLE[c]\n      }))\n    }));\n  }\n\n  /* ---------------- charts ---------------- */\n  linePath(vals, w, h, pad) {\n    const n = vals.length;\n    const min = Math.min(...vals), max = Math.max(...vals);\n    const span = (max - min) || 1;\n    const X = (i) => pad + (i * (w - pad * 2)) / (n - 1);\n    const Y = (v) => (h - pad) - ((v - min) / span) * (h - pad * 2);\n    let d = '';\n    vals.forEach((v, i) => { d += (i ? 'L' : 'M') + X(i).toFixed(1) + ' ' + Y(v).toFixed(1) + ' '; });\n    const area = d + 'L' + X(n - 1).toFixed(1) + ' ' + (h - pad) + ' L' + X(0).toFixed(1) + ' ' + (h - pad) + ' Z';\n    return { line: d.trim(), area };\n  }\n\n  renderVals() {\n    const stateProp = this.props.dataState ?? 'Week one';\n    const isWeek1 = stateProp !== 'Two years in';\n    const f = isWeek1 ? this.week1() : this.mature();\n\n    const deltaProp = this.props.deltaWindow ?? '7 days';\n    const win = deltaProp === '28 days' ? 28 : 7;\n    const deltaLabel = win === 28 ? '28d' : '7d';\n\n    const P = this.PLAT;\n    const n = f.days.length;\n    const deltaOf = (series) => {\n      const i = n - 1 - win;\n      if (i < 0) return null;                       // history starts at connection\n      return series[n - 1] - series[i];\n    };\n\n    const toneFor = (d) => d === null ? 'var(--text-tertiary)'\n      : d > 0 ? 'var(--state-positive)' : d < 0 ? 'var(--state-negative)' : 'var(--text-tertiary)';\n\n    /* accounts */\n    const accounts = f.accounts.map((a) => {\n      const d = deltaOf(a.series);\n      const followers = a.series[n - 1];\n      const pill = 'font-size:var(--text-micro);letter-spacing:0.08em;text-transform:uppercase;padding:2px var(--space-2);border-radius:var(--radius-sm);background:' + P[a.p].tint + ';color:' + P[a.p].color;\n      return {\n        name: a.name, handle: a.handle, platformLabel: P[a.p].label,\n        followers: this.fmt(followers),\n        delta: d === null ? 'no history' : this.signed(d),\n        posts: this.fmt(a.posts), asOf: a.asOf,\n        rawDelta: d, color: P[a.p].color,\n        barStyle: 'width:3px;height:30px;border-radius:2px;flex:none;background:' + P[a.p].color,\n        pillStyle: pill,\n        deltaStyle: 'text-align:right;font-variant-numeric:tabular-nums;font-size:' + (d === null ? 'var(--text-label)' : 'var(--text-body)') + ';color:' + toneFor(d),\n        deltaInlineStyle: 'font-size:var(--text-label);font-variant-numeric:tabular-nums;color:' + toneFor(d),\n        cardStyle: 'background:var(--surface-overlay);border:1px solid var(--border-subtle);border-left:3px solid ' + P[a.p].color + ';border-radius:var(--radius-md);padding:var(--space-4);cursor:pointer'\n      };\n    });\n\n    /* totals */\n    const totalFollowers = f.accounts.reduce((s, a) => s + a.series[n - 1], 0);\n    const totalDelta = f.accounts.reduce((s, a) => {\n      const d = deltaOf(a.series); return d === null ? s : s + d;\n    }, 0);\n    const hasDelta = deltaOf(f.accounts[0].series) !== null;\n    const platforms = [...new Set(f.accounts.map((a) => a.p))];\n\n    const subStyle = (tone) => 'font-size:var(--text-label);color:' + tone + ';margin-top:var(--space-2);font-variant-numeric:tabular-nums';\n\n    const kpis = [\n      { label:'Total followers', value:this.fmt(totalFollowers),\n        sub: hasDelta ? this.signed(totalDelta) + ' in ' + deltaLabel : 'no ' + deltaLabel + ' history yet',\n        tone: hasDelta ? toneFor(totalDelta) : 'var(--text-tertiary)' },\n      { label:'Posts published', value:String(f.postsInRange), sub:f.cadence, tone:'var(--text-secondary)' },\n      { label:'Engagement rate', value:f.engagement, sub:'interactions ÷ views', tone:'var(--text-secondary)' },\n      { label:'Platforms', value:String(platforms.length), sub:platforms.map((p) => P[p].label).join(' · '), tone:'var(--text-secondary)' },\n      { label:'Accounts', value:String(f.accounts.length), sub:'all reporting', tone:'var(--text-secondary)' }\n    ].map((k, i) => ({\n      ...k,\n      cellStyle: 'padding:var(--space-4) var(--space-5);' + (i ? 'border-left:1px solid var(--border-subtle)' : ''),\n      subStyle: subStyle(k.tone)\n    }));\n\n    const kpiCards = kpis.slice(0, 4).map((k) => ({ label:k.label, value:k.value, sub:k.sub, subStyle:k.subStyle }));\n\n    const figures = [\n      { label:'Total followers', value:this.fmt(totalFollowers),\n        sub: hasDelta ? this.signed(totalDelta) + ' in ' + deltaLabel : 'no ' + deltaLabel + ' history yet',\n        tone: hasDelta ? toneFor(totalDelta) : 'var(--text-tertiary)' },\n      { label:'Posting cadence', value:f.cadence.split(' ')[0], sub:'a week, across ' + f.accounts.length + ' accounts', tone:'var(--text-secondary)' },\n      { label:'Engagement rate', value:f.engagement, sub:'the one rate that compares', tone:'var(--text-secondary)' }\n    ].map((g) => ({ ...g, subStyle: subStyle(g.tone) }));\n\n    /* narrative lede — assembled only from figures present above */\n    const ranked = [...accounts].filter((a) => a.rawDelta !== null).sort((a, b) => b.rawDelta - a.rawDelta);\n    const top = ranked[0];\n    const worst = ranked[ranked.length - 1];\n    let ledeA, ledeB;\n    if (!hasDelta) {\n      ledeA = f.accounts.length + ' accounts are reporting, ' + n + ' days in. There is no ' + deltaLabel + ' comparison yet.';\n      ledeB = 'Follower history starts the day an account is connected — no platform backfills it. Come back after ' + deltaLabel + ' of collection for movement.';\n    } else if (isWeek1) {\n      ledeA = f.accounts.length + ' accounts reporting. ' + top.name + ' is doing the moving — ' + top.delta + ' this week.';\n      ledeB = 'YouTube analytics end ' + f.ytLagEnds + '; that is the API lagging two to three days, not a missed sync. All three Instagram accounts sit below Meta\\u2019s 100-follower threshold, so Instagram returns no follower breakdown at all yet.';\n    } else {\n      ledeA = this.fmt(totalFollowers) + ' followers across ' + f.accounts.length + ' accounts. ' + top.name + ' leads at ' + top.delta + '.';\n      ledeB = (worst.rawDelta < 0\n        ? worst.name + ' slipped ' + worst.delta + ' — the only account down this week. '\n        : 'Every account is up this week. ')\n        + 'TikTok movement stays derived from daily snapshots, so treat it as close rather than exact.';\n    }\n\n    const maxAbs = Math.max(1, ...ranked.map((a) => Math.abs(a.rawDelta)));\n    const movers = ranked.map((m) => ({\n      name:m.name, handle:m.handle, platformLabel:m.platformLabel, delta:m.delta,\n      barStyle:'width:3px;height:32px;border-radius:2px;flex:none;background:' + m.color,\n      fillStyle:'display:block;height:100%;border-radius:var(--radius-pill);width:' +\n        Math.round((Math.abs(m.rawDelta) / maxAbs) * 100) + '%;background:' +\n        (m.rawDelta < 0 ? 'var(--state-negative)' : 'var(--state-positive)'),\n      deltaStyle:'width:74px;text-align:right;font-family:var(--font-head);font-weight:300;font-size:var(--figure-sm);font-variant-numeric:tabular-nums;color:' + toneFor(m.rawDelta)\n    }));\n\n    /* audience chart — one line per platform */\n    const byPlatform = {};\n    f.accounts.forEach((a) => {\n      if (!byPlatform[a.p]) byPlatform[a.p] = new Array(n).fill(0);\n      a.series.forEach((v, i) => { byPlatform[a.p][i] += v; });\n    });\n    const W = 640, H = 200, PAD = 8;\n    const allVals = Object.values(byPlatform).flat();\n    const gMin = Math.min(...allVals), gMax = Math.max(...allVals);\n    const gSpan = (gMax - gMin) || 1;\n    const scaled = (vals) => {\n      const X = (i) => PAD + (i * (W - PAD * 2)) / (n - 1);\n      const Y = (v) => (H - PAD) - ((v - gMin) / gSpan) * (H - PAD * 2);\n      let d = '';\n      vals.forEach((v, i) => { d += (i ? 'L' : 'M') + X(i).toFixed(1) + ' ' + Y(v).toFixed(1) + ' '; });\n      return { line: d.trim(), area: d + 'L' + X(n - 1).toFixed(1) + ' ' + (H - PAD) + ' L' + X(0).toFixed(1) + ' ' + (H - PAD) + ' Z' };\n    };\n    const order = ['youtube','tiktok','instagram','facebook'].filter((p) => byPlatform[p]);\n    const audience = {\n      grid: [0,1,2,3].map((i) => ({ y: (PAD + i * ((H - PAD * 2) / 3)).toFixed(1) })),\n      series: order.map((p) => ({ ...scaled(byPlatform[p]), color:P[p].color, tint:P[p].tint })),\n      legend: order.map((p) => ({\n        label:P[p].label, value:this.fmt(byPlatform[p][n - 1]),\n        dotStyle:'width:8px;height:8px;border-radius:50%;flex:none;background:' + P[p].color\n      })),\n      xLabels: [0, Math.floor((n - 1) / 3), Math.floor(2 * (n - 1) / 3), n - 1].map((i) => f.days[i])\n    };\n\n    /* YouTube daily views — bars, short by design (the lag) */\n    const bw = 400, bh = 90, gap = 6;\n    const ymax = Math.max(...f.ytViews);\n    const barW = (bw - gap * (f.ytViews.length - 1)) / f.ytViews.length;\n    const ytBars = f.ytViews.map((v, i) => {\n      const h = Math.max(2, (v / ymax) * (bh - 6));\n      return { x:(i * (barW + gap)).toFixed(1), y:(bh - h).toFixed(1), w:barW.toFixed(1), h:h.toFixed(1) };\n    });\n    const igReach = this.linePath(f.igReach, 400, 90, 6);\n\n    /* sync health */\n    const LED = {\n      ok:'var(--state-positive)', error:'var(--state-negative)',\n      running:'var(--state-progress)', skipped:'var(--state-neutral)'\n    };\n    const sync = f.sync.map((s) => ({\n      platformLabel:P[s.p].label,\n      detail: s.status === 'error' ? s.name + ' · ' + s.msg : (s.status === 'running' ? s.name + ' · ' + s.msg : s.name),\n      when:s.when,\n      ledStyle:'width:7px;height:7px;border-radius:50%;flex:none;background:' + LED[s.status] +\n        (s.status === 'running' ? ';animation:sigPulse 1.4s ease-in-out infinite' : '') +\n        (s.status === 'ok' ? ';box-shadow:0 0 0 3px rgba(200,162,76,0.14)' : '') +\n        (s.status === 'error' ? ';box-shadow:0 0 0 3px rgba(192,89,59,0.14)' : ''),\n      pillStyle:'font-size:var(--text-micro);letter-spacing:0.08em;text-transform:uppercase;padding:2px var(--space-2);border-radius:var(--radius-sm);white-space:nowrap;background:' + P[s.p].tint + ';color:' + P[s.p].color\n    }));\n\n    /* posts */\n    const posts = f.posts.map((p) => ({\n      title:p.title, account:p.account, published:p.published,\n      views:this.fmt(p.views), likes:this.fmt(p.likes), eng:p.eng,\n      platformLabel:P[p.p].label,\n      pillStyle:'display:inline-block;font-size:var(--text-micro);letter-spacing:0.08em;text-transform:uppercase;padding:2px var(--space-2);border-radius:var(--radius-sm);background:' + P[p.p].tint + ';color:' + P[p.p].color,\n      thumbStyle:'display:block;width:44px;height:26px;border-radius:var(--radius-sm);background:linear-gradient(120deg,var(--surface-overlay),var(--border-default))',\n      thumbLargeStyle:'display:block;width:88px;height:56px;flex:none;border-radius:var(--radius-md);background:linear-gradient(120deg,var(--surface-overlay),var(--border-default))'\n    }));\n\n    /* tabs */\n    const tabBase = 'display:inline-flex;align-items:center;gap:var(--space-2);padding:var(--space-3) 0;font-size:var(--text-body);';\n    const tabs = [{ p:null, label:'Overview', active:true }]\n      .concat(platforms.map((p) => ({ p, label:P[p].label, active:false })))\n      .map((t) => ({\n        label:t.label,\n        consoleStyle: tabBase + (t.active\n          ? 'color:var(--text-primary);box-shadow:inset 0 -2px 0 var(--text-primary)'\n          : 'color:var(--text-tertiary)'),\n        dotStyle: t.p\n          ? 'width:6px;height:6px;border-radius:50%;flex:none;background:' + P[t.p].color\n          : 'display:none'\n      }));\n\n    /* rail (1c) — platform → account, unconnected platforms stay visible */\n    const rowBase = 'display:flex;align-items:center;gap:var(--space-3);padding:var(--space-2) var(--space-3);border-radius:var(--radius-md);font-size:var(--text-body);margin-bottom:2px;';\n    const rail = [];\n    rail.push({\n      label:'Overview', meta:'',\n      rowStyle: rowBase + 'color:var(--text-primary);background:var(--surface-overlay);font-weight:600',\n      dotStyle:'width:6px;height:6px;border-radius:50%;flex:none;background:var(--brand-gold)',\n      metaStyle:'display:none'\n    });\n    ['youtube','instagram','tiktok','facebook'].forEach((p) => {\n      const kids = f.accounts.filter((a) => a.p === p);\n      const connected = kids.length > 0;\n      rail.push({\n        label:P[p].label,\n        meta: connected ? String(kids.length) : (p === 'tiktok' ? 'Connect' : 'No Page'),\n        rowStyle: rowBase + 'margin-top:var(--space-3);' + (connected ? 'color:var(--text-secondary)' : 'color:var(--text-tertiary)'),\n        dotStyle:'width:6px;height:6px;border-radius:50%;flex:none;' +\n          (connected ? 'background:' + P[p].color : 'border:1px dashed var(--avail-absent);background:transparent'),\n        metaStyle:'font-size:var(--text-micro);color:' + (connected ? 'var(--text-tertiary)' : 'var(--brand-peri)')\n      });\n      kids.forEach((a) => {\n        rail.push({\n          label:a.name, meta:this.fmt(a.series[n - 1]),\n          rowStyle: rowBase + 'padding-left:var(--space-6);color:var(--text-tertiary);font-size:var(--text-label)',\n          dotStyle:'display:none',\n          metaStyle:'font-size:var(--text-micro);color:var(--text-tertiary);font-variant-numeric:tabular-nums'\n        });\n      });\n    });\n\n    /* availability, prose form (1b) */\n    const proseWrap = 'border-left:2px solid var(--border-default);padding-left:var(--space-4)';\n    const statusChip = (tone) => 'font-size:var(--text-micro);letter-spacing:var(--track-label);text-transform:uppercase;color:' + tone;\n    const availProse = [\n      { p:'youtube', status:'Richest, but late', tone:'var(--avail-lagged)',\n        text:'Everything — daily views, watch time, subscribers gained and lost, per-video figures. The catch is timing: the analytics API runs two to three days behind, so the last few days of any chart are legitimately empty. Subscriber counts round to three significant figures above a thousand.' },\n      { p:'instagram', status:'Reach only, per day', tone:'var(--avail-live)',\n        text:'Reach is the only daily series Instagram provides. Views, likes, saves and interactions arrive as one rolling 28-day total per sync, which cannot be broken into days. Below 100 followers Meta returns no follower breakdown at all — where all three accounts sit today.' },\n      { p:'tiktok', status: f.tiktokConnected ? 'Derived, not measured' : 'Built, not connected', tone: f.tiktokConnected ? 'var(--avail-rolling)' : 'var(--text-tertiary)',\n        text: f.tiktokConnected\n          ? 'TikTok reports cumulative totals only. Daily movement is worked out by differencing yesterday against today, so it needs two days before it says anything, and a missed sync folds two days into one.'\n          : 'The collector is written and waiting on a credential. When it lands, expect cumulative totals only — daily movement will be derived by differencing snapshots, never measured directly.' },\n      { p:'facebook', status:'No Page exists', tone:'var(--text-tertiary)',\n        text:'Nothing is connected, and Meta is actively retiring Page metrics — impressions, plays and profile views were withdrawn across all API versions in April 2025. Treat any Facebook figure as provisional if a Page is ever added.' }\n    ].map((x) => ({\n      platformLabel:P[x.p].label, status:x.status, text:x.text,\n      wrapStyle:proseWrap,\n      statusStyle:statusChip(x.tone),\n      pillStyle:'display:inline-block;font-size:var(--text-micro);letter-spacing:0.08em;text-transform:uppercase;padding:2px var(--space-2);border-radius:var(--radius-sm);background:' + P[x.p].tint + ';color:' + P[x.p].color\n    }));\n\n    const availCols = ['youtube','instagram','tiktok','facebook'].map((p) => ({\n      short:P[p].short,\n      headStyle:'text-align:center;padding:0 0 var(--space-2);border-bottom:1px solid var(--border-default);font-size:var(--text-micro);letter-spacing:var(--track-label);text-transform:uppercase;color:' + P[p].color\n    }));\n    const availLegend = ['live','lag','roll','deriv','none','err'].map((c) => ({\n      label:this.GLYPH_TITLE[c], glyphStyle:this.GLYPH[c]\n    }));\n\n    /* token sheet */\n    const sw = (v) => 'width:22px;height:14px;border-radius:3px;flex:none;background:' + v + ';border:1px solid var(--border-subtle)';\n    const swText = (fam, size) => 'width:22px;flex:none;font-family:' + fam + ';font-size:' + size + ';color:var(--text-secondary);text-align:center';\n    const tokenGroups = [\n      { title:'Surface', note:'Four depths. Base is the page, raised is a panel, overlay is a control or nested card, sunken is a well.',\n        rows:[['--surface-base','#191220'],['--surface-raised','#241B30'],['--surface-overlay','#2C2239'],['--surface-sunken','#140E1B']]\n          .map(([nm,v]) => ({ name:nm, value:v, swatchStyle:sw(v) })) },\n      { title:'Border', note:'Subtle divides inside a panel, default outlines it, strong marks a selected or hovered edge.',\n        rows:[['--border-subtle','#2A2036'],['--border-default','#372C47'],['--border-strong','#4A3C5E']]\n          .map(([nm,v]) => ({ name:nm, value:v, swatchStyle:sw(v) })) },\n      { title:'Text', note:'Three weights of attention plus the inverse used on the periwinkle action.',\n        rows:[['--text-primary','#FAF6EE'],['--text-secondary','#B7AEC2'],['--text-tertiary','#7D7290'],['--text-on-accent','#191220']]\n          .map(([nm,v]) => ({ name:nm, value:v, swatchStyle:sw(v) })) },\n      { title:'State', note:'Drawn from the palette, never invented. Gold is the light, so gold is up.',\n        rows:[['--state-positive','Gold #C8A24C'],['--state-negative','Terracotta #C0593B'],['--state-progress','Periwinkle #8E8BD8'],['--state-neutral','#7D7290']]\n          .map(([nm,v]) => ({ name:nm, value:v, swatchStyle:sw(v.split(' ').pop()) })) },\n      { title:'Data encoding', note:'Platform hues. Confined to chart strokes, pills and the 3px account rule — never a surface, never a button.',\n        rows:[['--data-youtube','#FF4E45'],['--data-instagram','#E1477E'],['--data-facebook','#4A8CFF'],['--data-tiktok','#25E5D0']]\n          .map(([nm,v]) => ({ name:nm, value:v, swatchStyle:sw(v) })) },\n      { title:'Availability', note:'The new family. Distinguishes missing-by-design (hollow) from missing-because-broken (terracotta) — requirement R4.',\n        rows:[['--avail-live','Daily'],['--avail-lagged','Lags 2–3d'],['--avail-rolling','28d rolling'],['--avail-derived','Differenced'],['--avail-absent','Not provided'],['--avail-error','Failing']]\n          .map(([nm,v]) => ({ name:nm, value:v, swatchStyle:sw('var(' + nm + ')') })) },\n      { title:'Type', note:'Three roles, unchanged from the handbook. All four files are present in this project.',\n        rows:[\n          { name:'--font-display', value:'Glamour Absolute Ext.', swatchStyle:swText('var(--font-display)','13px') },\n          { name:'--font-head', value:'Recoleta 300', swatchStyle:swText('var(--font-head)','15px') },\n          { name:'--font-body', value:'Graphik 400/600', swatchStyle:swText('var(--font-body)','13px') }\n        ] },\n      { title:'Scale', note:'Type ramp and a 4px spacing base. Figures use the head face at tabular numerals throughout.',\n        rows:[['--text-micro','11px'],['--text-label','12px'],['--text-body','14px'],['--figure-sm','20px'],['--figure-md','28px'],['--figure-lg','40px'],['--figure-xl','60px'],['--space-1 … --space-8','4 · 8 · 12 · 16 · 24 · 32 · 48 · 64']]\n          .map(([nm,v]) => ({ name:nm, value:v, swatchStyle:'width:22px;flex:none' })) },\n      { title:'Shape & motion', note:'Radius climbs with the size of the thing. Durations are short — this is a tool, not a show.',\n        rows:[['--radius-sm','4px'],['--radius-md','8px'],['--radius-lg','12px'],['--radius-pill','999px'],['--dur-fast','120ms'],['--dur-base','200ms'],['--dur-slow','400ms'],['--ease-out','cubic-bezier(.2,.7,.2,1)']]\n          .map(([nm,v]) => ({ name:nm, value:v, swatchStyle:'width:22px;flex:none' })) }\n    ];\n\n    /* ---------------- 2a · Board shell + scope-aware briefing header ---------------- */\n    const scope = this.state.scope || { kind:'all' };\n    let subset, scopeTitle, scopeSub, activePlatform = null;\n    if (scope.kind === 'platform') {\n      subset = f.accounts.filter((a) => a.p === scope.p);\n      scopeTitle = P[scope.p].label;\n      scopeSub = subset.length + (subset.length === 1 ? ' account' : ' accounts');\n      activePlatform = scope.p;\n    } else if (scope.kind === 'account') {\n      const a = f.accounts[scope.i];\n      subset = [a];\n      scopeTitle = a.name;\n      scopeSub = P[a.p].label + ' · ' + a.handle;\n      activePlatform = a.p;\n    } else {\n      subset = f.accounts;\n      scopeTitle = 'Overview';\n      scopeSub = 'all platforms · all accounts';\n    }\n\n    const mFollowers = subset.reduce((s, a) => s + a.series[n - 1], 0);\n    const mRanked = subset\n      .map((a) => ({ a, d: deltaOf(a.series) }))\n      .filter((x) => x.d !== null)\n      .sort((x, y) => y.d - x.d);\n    const mDelta = mRanked.reduce((s, x) => s + x.d, 0);\n    const mHasDelta = mRanked.length > 0;\n\n    /* the lede, rewritten per scope — only ever states figures present above */\n    let mLedeA, mLedeB;\n    const lagged = (t) => t.replace('{lag}', f.ytLagEnds);\n    if (!mHasDelta) {\n      mLedeA = subset.length + (subset.length === 1 ? ' account' : ' accounts') + ' reporting, ' + n + ' days in. No ' + deltaLabel + ' comparison yet.';\n      mLedeB = 'Follower history starts the day an account is connected — no platform backfills it.';\n    } else if (scope.kind === 'account') {\n      const one = mRanked[0];\n      mLedeA = this.fmt(mFollowers) + ' followers, ' + this.signed(one.d) + ' this ' + (win === 7 ? 'week' : 'month') + '.';\n      mLedeB = lagged(this.PLATFORM_CAVEAT[subset[0].p]);\n    } else if (scope.kind === 'platform') {\n      const top = mRanked[0];\n      mLedeA = scopeTitle + ' · ' + this.fmt(mFollowers) + ' followers across ' + subset.length +\n        (subset.length === 1 ? ' account' : ' accounts') + '. ' + top.a.name + ' leads at ' + this.signed(top.d) + '.';\n      mLedeB = lagged(this.PLATFORM_CAVEAT[scope.p]);\n    } else {\n      mLedeA = ledeA;\n      mLedeB = ledeB;\n    }\n\n    /* chart series follow the scope: platforms → accounts → one */\n    let chartList;\n    if (scope.kind === 'all') {\n      chartList = order.map((p) => ({ label:P[p].label, rgb:this.RAW[p], opacity:1, values:byPlatform[p] }));\n    } else {\n      const fade = [1, 0.62, 0.4, 0.3];\n      chartList = subset.map((a, i) => ({\n        label:a.name, rgb:this.RAW[a.p], opacity: subset.length === 1 ? 1 : fade[i] ?? 0.3, values:a.series\n      }));\n    }\n    const mChart = this.makeChart(chartList, f.days);\n\n    const mAccounts = subset.map((a) => {\n      const idx = f.accounts.indexOf(a);\n      const d = deltaOf(a.series);\n      return {\n        name:a.name, handle:a.handle, platformLabel:P[a.p].label,\n        followers:this.fmt(a.series[n - 1]),\n        delta: d === null ? 'no history' : this.signed(d),\n        posts:this.fmt(a.posts), asOf:a.asOf,\n        on: () => this.setScope({ kind:'account', i:idx }),\n        pillStyle:'display:inline-block;font-size:var(--text-micro);letter-spacing:0.08em;text-transform:uppercase;padding:2px var(--space-2);border-radius:var(--radius-sm);background:' + P[a.p].tint + ';color:' + P[a.p].color,\n        deltaInlineStyle:'font-size:var(--text-label);font-variant-numeric:tabular-nums;color:' + toneFor(d),\n        cardStyle:'background:var(--surface-overlay);border:1px solid var(--border-subtle);border-left:3px solid ' + P[a.p].color + ';border-radius:var(--radius-md);padding:var(--space-4);cursor:pointer;transition:border-color var(--dur-base) var(--ease-out)'\n      };\n    });\n\n    const mPosts = posts.filter((p) => {\n      if (scope.kind === 'all') return true;\n      if (scope.kind === 'platform') return p.platformLabel === P[scope.p].label;\n      return p.account === f.accounts[scope.i].name;\n    });\n\n    /* KPI set changes with scope — scoped views drop figures the views can't give per-account */\n    const mKpis = (scope.kind === 'all' ? [\n      { label:'Total followers', value:this.fmt(mFollowers), sub: mHasDelta ? this.signed(mDelta) + ' in ' + deltaLabel : 'no history yet', tone: mHasDelta ? toneFor(mDelta) : 'var(--text-tertiary)' },\n      { label:'Posts published', value:String(f.postsInRange), sub:f.cadence, tone:'var(--text-secondary)' },\n      { label:'Engagement rate', value:f.engagement, sub:'the one rate that compares', tone:'var(--text-secondary)' },\n      { label:'Accounts', value:String(subset.length), sub:platforms.map((p) => P[p].label).join(' · '), tone:'var(--text-secondary)' }\n    ] : [\n      { label:'Followers', value:this.fmt(mFollowers), sub:'latest daily snapshot', tone:'var(--text-secondary)' },\n      { label:'Change · ' + deltaLabel, value: mHasDelta ? this.signed(mDelta) : '—', sub: mHasDelta ? 'from the snapshot series' : 'not enough history', tone: mHasDelta ? toneFor(mDelta) : 'var(--text-tertiary)' },\n      { label:'Posts', value:this.fmt(subset.reduce((s, a) => s + a.posts, 0)), sub:'lifetime, from the snapshot', tone:'var(--text-secondary)' },\n      { label:'Last snapshot', value:subset[0].asOf, sub: subset.length === 1 ? 'this account' : 'across ' + subset.length, tone:'var(--text-secondary)' }\n    ]).map((k) => ({ ...k, subStyle: subStyle(k.tone) }));\n\n    /* interactive rail */\n    const isActive = (kind, key) =>\n      (kind === 'all' && scope.kind === 'all') ||\n      (kind === 'platform' && scope.kind === 'platform' && scope.p === key) ||\n      (kind === 'account' && scope.kind === 'account' && scope.i === key);\n    const activeRow = 'color:var(--text-primary);background:var(--surface-overlay);font-weight:600';\n    const mRail = [];\n    mRail.push({\n      label:'Overview', meta:'', on:() => this.setScope({ kind:'all' }),\n      rowStyle: rowBase + 'cursor:pointer;' + (isActive('all') ? activeRow : 'color:var(--text-secondary)'),\n      dotStyle:'width:6px;height:6px;border-radius:50%;flex:none;background:var(--brand-gold)',\n      metaStyle:'display:none'\n    });\n    ['youtube','instagram','tiktok','facebook'].forEach((p) => {\n      const kids = f.accounts.filter((a) => a.p === p);\n      const connected = kids.length > 0;\n      mRail.push({\n        label:P[p].label,\n        meta: connected ? String(kids.length) : (p === 'tiktok' ? 'Connect' : 'No Page'),\n        on: connected ? () => this.setScope({ kind:'platform', p }) : () => {},\n        rowStyle: rowBase + 'margin-top:var(--space-3);' +\n          (connected ? 'cursor:pointer;' + (isActive('platform', p) ? activeRow : 'color:var(--text-secondary)') : 'color:var(--text-tertiary)'),\n        dotStyle:'width:6px;height:6px;border-radius:50%;flex:none;' +\n          (connected ? 'background:' + P[p].color : 'border:1px dashed var(--avail-absent);background:transparent'),\n        metaStyle:'font-size:var(--text-micro);color:' + (connected ? 'var(--text-tertiary)' : 'var(--brand-peri)')\n      });\n      kids.forEach((a) => {\n        const idx = f.accounts.indexOf(a);\n        mRail.push({\n          label:a.name, meta:this.fmt(a.series[n - 1]),\n          on:() => this.setScope({ kind:'account', i:idx }),\n          rowStyle: rowBase + 'padding-left:var(--space-6);cursor:pointer;font-size:var(--text-label);' +\n            (isActive('account', idx) ? activeRow : 'color:var(--text-tertiary)'),\n          dotStyle:'display:none',\n          metaStyle:'font-size:var(--text-micro);color:var(--text-tertiary);font-variant-numeric:tabular-nums'\n        });\n      });\n    });\n\n    const mAvailCols = ['youtube','instagram','tiktok','facebook'].map((p) => ({\n      short:P[p].short,\n      headStyle:'text-align:center;padding:0 0 var(--space-2);border-bottom:1px solid var(--border-default);font-size:var(--text-micro);letter-spacing:var(--track-label);text-transform:uppercase;color:' + P[p].color +\n        (activePlatform && activePlatform !== p ? ';opacity:0.32' : '')\n    }));\n    const mAvailRows = this.availability(f).map((r) => ({\n      metric:r.metric,\n      cells:r.cells.map((c, i) => {\n        const p = ['youtube','instagram','tiktok','facebook'][i];\n        const dim = activePlatform && activePlatform !== p;\n        return { ...c, glyphStyle: c.glyphStyle + (dim ? ';opacity:0.28' : '') };\n      })\n    }));\n\n    const m = {\n      scopeTitle, scopeSub, ledeA:mLedeA, ledeB:mLedeB,\n      kpis:mKpis, chart:mChart, accounts:mAccounts, posts:mPosts, rail:mRail,\n      availCols:mAvailCols, availRows:mAvailRows,\n      isScoped: scope.kind !== 'all',\n      isAll: scope.kind === 'all',\n      showYt: scope.kind === 'all' || activePlatform === 'youtube',\n      showIg: scope.kind === 'all' || activePlatform === 'instagram',\n      showNoDaily: scope.kind !== 'all' && activePlatform !== 'youtube' && activePlatform !== 'instagram',\n      noDailyText: activePlatform === 'tiktok'\n        ? 'TikTok reports cumulative totals only — there is no daily series to plot, by design.'\n        : 'No daily series for this scope.',\n      clearScope: () => this.setScope({ kind:'all' }),\n      accountsHint: scope.kind === 'account' ? 'Showing one account.' : 'Each card narrows the whole page to that account.'\n    };\n\n    return {\n      m,\n      f: { ...f, ledeA, ledeB, accountCount: f.accounts.length, platformCount: platforms.length },\n      deltaLabel,\n      stateLabel: isWeek1 ? 'Week one' : 'Two years in',\n      showTokens: this.props.showTokenSheet ?? true,\n      kpis, kpiCards, figures, accounts, movers, audience, ytBars, igReach,\n      sync, posts, tabs, rail,\n      availRows: this.availability(f), availCols, availLegend, availProse,\n      availColCount: 4,\n      tokenGroups\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
