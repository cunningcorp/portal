<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Signal — Cunning Corp</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><circle cx='16' cy='16' r='9' fill='none' stroke='%238E8BD8' stroke-width='2'/><circle cx='16' cy='7' r='2.6' fill='%23C8A24C'/></svg>">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js"></script>
<style>
/* ==========================================================================
   Cunning Corp house palette and type, per the Brand Handbook:
   Plum #241B30 base·night · Plum Deep #191220 gradient floor · Gold #C8A24C the
   light · Gold Soft #E3C57E highlight · Periwinkle #8E8BD8 accent·play ·
   Paper #FAF6EE light ground. Division accents: Terracotta #C0593B Aubrey North ·
   Slate #2C3E5D Publications · Teal #1F5F5B Productions.

   Glamour Absolute and Graphik are declared but not committed — drop the woff2
   files into /fonts and they take over. Until then Recoleta and a system sans.
   ========================================================================== */

@font-face{font-family:'Glamour Absolute Extended';font-weight:400;font-display:swap;
  src:url(fonts/GlamourAbsoluteExtended-400.woff2) format('woff2')}
@font-face{font-family:'Glamour Absolute';font-weight:400;font-display:swap;
  src:url(fonts/GlamourAbsolute-400.woff2) format('woff2')}
@font-face{font-family:'Graphik';font-weight:400;font-display:swap;
  src:url(fonts/Graphik-400.woff2) format('woff2')}
@font-face{font-family:'Graphik';font-weight:600;font-display:swap;
  src:url(fonts/Graphik-600.woff2) format('woff2')}
@font-face{font-family:'Recoleta';font-weight:300;font-display:swap;
  src:url(fonts/Recoleta-300.woff2) format('woff2')}

:root{
  color-scheme: dark;
  --plum-deep:#191220; --plum:#241B30; --plum-lift:#2c2239;
  --gold:#C8A24C; --gold-soft:#E3C57E; --peri:#8E8BD8; --paper:#FAF6EE;
  --bg:var(--plum-deep); --panel:var(--plum); --panel-2:var(--plum-lift);
  --line:#372c47; --line-soft:#2a2036;
  --ink:var(--paper); --mute:#B7AEC2; --dim:#7d7290;
  --up:var(--gold); --down:#C0593B; --warn:var(--peri);
  /* platform colours: data encoding only, deliberately outside the brand */
  --yt:#ff4e45; --ig:#e1477e; --fb:#4a8cff; --tt:#25e5d0;
  --font-display:'Glamour Absolute Extended','Glamour Absolute','Recoleta',Georgia,serif;
  --font-head:'Recoleta',Georgia,serif;
  --font-body:'Graphik',ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --r:12px;
}
*{box-sizing:border-box}
body{margin:0;color:var(--ink);font:14px/1.55 var(--font-body);-webkit-font-smoothing:antialiased;
  background:
    radial-gradient(1100px 620px at 78% -12%, rgba(142,139,216,.13), transparent 62%),
    radial-gradient(760px 460px at 4% 4%, rgba(200,162,76,.06), transparent 60%),
    var(--bg);
  background-attachment:fixed}
a{color:inherit}
button{font:inherit;cursor:pointer}
.hide{display:none !important}
:focus-visible{outline:2px solid var(--peri);outline-offset:2px;border-radius:4px}

/* ---------- shell ---------- */
header.top{position:sticky;top:0;z-index:20;background:rgba(25,18,32,.86);backdrop-filter:blur(12px);
  border-bottom:1px solid var(--line-soft)}
.bar{display:flex;align-items:center;gap:1rem;padding:.8rem 1.5rem;max-width:1500px;margin:0 auto}
.brand{display:flex;align-items:center;gap:.6rem;font-family:var(--font-display);
  font-size:1.02rem;letter-spacing:.03em}
.brand .sub{font-family:var(--font-body);font-size:.72rem;letter-spacing:.14em;
  text-transform:uppercase;color:var(--dim);padding-left:.6rem;border-left:1px solid var(--line)}
.mark{width:17px;height:17px;flex:none}
.spacer{flex:1}
.btn{background:transparent;border:1px solid var(--line);color:var(--mute);
  padding:.42rem .85rem;border-radius:8px;transition:.15s;font-size:.86rem}
.btn:hover{border-color:#4a3c5e;color:var(--ink)}
.btn.primary{background:var(--peri);border-color:var(--peri);color:var(--plum-deep);font-weight:600}
.btn.primary:hover{filter:brightness(1.07)}
.btn:disabled{opacity:.45;cursor:not-allowed}

/* ---------- tabs ---------- */
nav.tabs{display:flex;gap:.15rem;padding:0 1.5rem;max-width:1500px;margin:0 auto;overflow-x:auto}
nav.tabs button{background:none;border:0;border-bottom:2px solid transparent;color:var(--dim);
  padding:.55rem .85rem;font-size:.87rem;white-space:nowrap;transition:.15s}
nav.tabs button:hover{color:var(--mute)}
nav.tabs button[aria-selected="true"]{color:var(--paper);border-bottom-color:var(--peri)}
nav.tabs button .dot{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:.45rem;
  vertical-align:middle}
main{padding:1.5rem;max-width:1500px;margin:0 auto}

.rangebar{display:flex;gap:.3rem;background:rgba(36,27,48,.7);border:1px solid var(--line-soft);
  border-radius:9px;padding:.2rem}
.rangebar button{background:none;border:0;color:var(--dim);padding:.28rem .68rem;
  border-radius:6px;font-size:.8rem}
.rangebar button[aria-pressed="true"]{background:var(--panel-2);color:var(--ink)}

/* ---------- kpi ---------- */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(185px,1fr));gap:.85rem;margin-bottom:1.25rem}
.kpi{background:var(--panel);border:1px solid var(--line-soft);border-radius:var(--r);padding:1rem 1.1rem}
.kpi .label{font-size:.7rem;text-transform:uppercase;letter-spacing:.1em;color:var(--dim)}
.kpi .value{font-family:var(--font-head);font-size:2rem;font-weight:300;letter-spacing:-.015em;
  margin:.3rem 0 .15rem;font-variant-numeric:tabular-nums;color:var(--paper)}
.kpi .sub{font-size:.79rem;color:var(--mute);font-variant-numeric:tabular-nums}
.up{color:var(--up)} .down{color:var(--down)}

/* ---------- panels ---------- */
.grid{display:grid;gap:1rem}
.cols-2{grid-template-columns:1.55fr 1fr}
@media(max-width:1050px){.cols-2{grid-template-columns:1fr}}
.panel{background:var(--panel);border:1px solid var(--line-soft);border-radius:var(--r);
  padding:1.1rem 1.2rem;margin-bottom:1rem}
.panel h2{margin:0 0 .15rem;font-family:var(--font-head);font-size:1.05rem;font-weight:300;
  letter-spacing:-.01em;color:var(--paper)}
.panel .hint{margin:0 0 .9rem;font-size:.78rem;color:var(--dim);max-width:70ch}
.chartbox{position:relative;height:270px}
.chartbox.tall{height:300px}

/* ---------- rolling totals ---------- */
.totals{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:.6rem}
.tot{background:var(--panel-2);border:1px solid var(--line-soft);border-radius:9px;padding:.7rem .8rem}
.tot .n{font-family:var(--font-head);font-size:1.3rem;font-weight:300;color:var(--paper);
  font-variant-numeric:tabular-nums}
.tot .l{font-size:.7rem;text-transform:uppercase;letter-spacing:.08em;color:var(--dim);margin-top:.15rem}

/* ---------- account cards ---------- */
.accounts{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:.85rem}
.acct{background:var(--panel-2);border:1px solid var(--line-soft);border-radius:10px;padding:.9rem;
  border-left:3px solid var(--line);transition:.15s}
.acct:hover{border-color:#4a3c5e}
.acct[data-p="youtube"]{border-left-color:var(--yt)}
.acct[data-p="instagram"]{border-left-color:var(--ig)}
.acct[data-p="facebook"]{border-left-color:var(--fb)}
.acct[data-p="tiktok"]{border-left-color:var(--tt)}
.acct .head{display:flex;align-items:center;gap:.6rem;margin-bottom:.7rem}
.acct img{width:32px;height:32px;border-radius:50%;object-fit:cover;background:var(--line);flex:none}
.acct .nm{font-weight:600;font-size:.88rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.acct .hd{font-size:.73rem;color:var(--dim)}
.acct .row{display:flex;justify-content:space-between;font-size:.82rem;padding:.17rem 0;
  font-variant-numeric:tabular-nums}
.acct .row span:first-child{color:var(--mute)}

/* ---------- table ---------- */
.tablewrap{overflow:auto;max-height:520px;border-radius:8px}
table{width:100%;border-collapse:collapse;font-size:.84rem}
th{position:sticky;top:0;background:var(--panel);text-align:left;font-weight:400;color:var(--dim);
  font-size:.7rem;text-transform:uppercase;letter-spacing:.1em;padding:0;
  border-bottom:1px solid var(--line);white-space:nowrap}
th button{width:100%;text-align:left;background:none;border:0;color:inherit;font:inherit;
  padding:.55rem .6rem}
th button:hover{color:var(--mute)}
th[aria-sort] button{color:var(--paper)}
td{padding:.55rem .6rem;border-bottom:1px solid var(--line-soft);vertical-align:middle;
  font-variant-numeric:tabular-nums}
tbody tr:hover{background:var(--panel-2)}
td.t{max-width:340px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-variant-numeric:normal}
td.t a:hover{color:var(--gold-soft)}
.pill{display:inline-block;font-size:.67rem;text-transform:uppercase;letter-spacing:.08em;
  padding:.14rem .45rem;border-radius:5px;background:var(--line);color:var(--mute)}
.pill.youtube{background:rgba(255,78,69,.15);color:#ff8079}
.pill.instagram{background:rgba(225,71,126,.15);color:#ef7fa5}
.pill.facebook{background:rgba(74,140,255,.15);color:#87b1ff}
.pill.tiktok{background:rgba(37,229,208,.14);color:#65eddd}
.thumb{width:52px;height:30px;object-fit:cover;border-radius:4px;background:var(--line)}

/* ---------- sync health ---------- */
.sync{display:flex;align-items:center;gap:.6rem;padding:.45rem 0;font-size:.83rem;
  border-bottom:1px solid var(--line-soft)}
.sync:last-child{border-bottom:0}
.led{width:7px;height:7px;border-radius:50%;flex:none}
.led.ok{background:var(--gold);box-shadow:0 0 0 3px rgba(200,162,76,.14)}
.led.error{background:var(--down);box-shadow:0 0 0 3px rgba(192,89,59,.14)}
.led.running{background:var(--peri)} .led.skipped{background:var(--dim)}
.sync .when{margin-left:auto;color:var(--dim);font-size:.77rem}

/* ---------- auth ---------- */
#gate{min-height:100vh;display:grid;place-items:center;padding:1.5rem}
.authcard{width:100%;max-width:25rem;background:var(--panel);border:1px solid var(--line-soft);
  border-radius:16px;padding:2.25rem}
.authcard .mk{display:flex;align-items:center;gap:.6rem;margin-bottom:1.6rem}
.authcard .wm{font-family:var(--font-display);font-size:.95rem;letter-spacing:.05em}
.authcard h1{margin:0 0 .4rem;font-family:var(--font-head);font-size:1.65rem;font-weight:300;
  letter-spacing:-.02em;color:var(--paper)}
.authcard p{margin:0 0 1.5rem;color:var(--mute);font-size:.87rem}
input[type=email]{width:100%;padding:.68rem .85rem;background:var(--plum-deep);
  border:1px solid var(--line);border-radius:8px;color:var(--ink);font:inherit;margin-bottom:.7rem}
input[type=email]::placeholder{color:var(--dim)}
input[type=email]:focus{outline:0;border-color:var(--peri)}
.msg{font-size:.83rem;margin-top:.9rem;color:var(--mute);min-height:1.2em}

.empty{text-align:center;padding:2.2rem 1rem;color:var(--dim);font-size:.86rem}
.empty h3{margin:0 0 .4rem;font-family:var(--font-head);font-weight:300;color:var(--mute);font-size:1.1rem}
.connectrow{display:flex;gap:.5rem;flex-wrap:wrap;justify-content:center;margin-top:1.1rem}
.toast{position:fixed;bottom:1.25rem;left:50%;transform:translateX(-50%);background:var(--panel-2);
  border:1px solid var(--line);padding:.6rem 1rem;border-radius:9px;font-size:.85rem;z-index:50;
  box-shadow:0 10px 34px rgba(0,0,0,.5)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
</style>
</head>
<body>

<!-- ================= AUTH GATE ================= -->
<div id="gate">
  <div class="authcard">
    <div class="mk">
      <svg class="mark" viewBox="0 0 32 32" aria-hidden="true">
        <circle cx="16" cy="16" r="9" fill="none" stroke="#8E8BD8" stroke-width="2"/>
        <circle cx="16" cy="7" r="2.6" fill="#C8A24C"/>
      </svg>
      <span class="wm">CUNNING CORP</span>
    </div>
    <h1>Signal</h1>
    <p>Every channel, one view. Sign in with a link sent to your email.</p>
    <input type="email" id="email" placeholder="you@cunningcorp.com" autocomplete="email">
    <button class="btn primary" id="sendLink" style="width:100%">Send sign-in link</button>
    <div class="msg" id="authMsg" role="status"></div>
  </div>
</div>

<!-- ================= APP ================= -->
<div id="app" class="hide">
  <header class="top">
    <div class="bar">
      <div class="brand">
        <svg class="mark" viewBox="0 0 32 32" aria-hidden="true">
          <circle cx="16" cy="16" r="9" fill="none" stroke="#8E8BD8" stroke-width="2"/>
          <circle cx="16" cy="7" r="2.6" fill="#C8A24C"/>
        </svg>
        SIGNAL <span class="sub">Cunning Corp</span>
      </div>
      <div class="rangebar" id="range" role="group" aria-label="Date range">
        <button data-d="7">7d</button>
        <button data-d="30" aria-pressed="true">30d</button>
        <button data-d="90">90d</button>
      </div>
      <div class="spacer"></div>
      <button class="btn" id="connectBtn">Connect account</button>
      <button class="btn primary" id="syncBtn">Sync now</button>
      <button class="btn" id="signOut">Sign out</button>
    </div>
    <nav class="tabs" id="tabs" role="tablist" aria-label="Platform"></nav>
  </header>

  <main>
    <div id="view"></div>
  </main>
</div>

<div class="toast hide" id="toast" role="status" aria-live="polite"></div>

<script type="module">
import { createClient } from "https://esm.sh/@supabase/supabase-js@2";

/* ============================ config ============================ */
const SUPABASE_URL = "https://qeafetctmtnqonhwhhlw.supabase.co";
const SUPABASE_KEY = "sb_publishable_gs_WsU5HUAs49uF6-A5Wog_Mvo62byI";
const sb = createClient(SUPABASE_URL, SUPABASE_KEY);

/* Platform colours are data encoding, not brand. Four muted house tones on one
   axis would be indistinguishable, and the charts would stop working. */
const COLOR = { youtube:"#ff4e45", instagram:"#e1477e", facebook:"#4a8cff", tiktok:"#25e5d0" };
const LABEL = { youtube:"YouTube", instagram:"Instagram", facebook:"Facebook", tiktok:"TikTok" };

/* Friendly names for metrics the collectors write. Anything not listed is
   humanised automatically, so a new metric appears without a code change. */
const METRIC_LABEL = {
  views:"Views", reach:"Reach", likes:"Likes", comments:"Comments", shares:"Shares",
  saves:"Saves", replies:"Replies", engagements:"Engagements",
  watch_time_minutes:"Watch time (min)", avg_view_duration_secs:"Avg view duration (s)",
  followers_gained:"Followers gained", followers_lost:"Followers lost",
  accounts_engaged:"Accounts engaged", total_interactions:"Total interactions",
};

/* What each platform does not provide, stated plainly rather than left as a hole. */
const CAVEAT = {
  instagram:"Instagram reports views only as a rolling 28-day total, so there is no daily views series — reach is the daily metric it does provide.",
  youtube:"YouTube analytics lag two to three days, so the right-hand end of every daily chart trails today.",
  tiktok:"TikTok's free API returns cumulative totals only. Daily movement is derived by differencing snapshots, so it needs two days of history before anything appears.",
  facebook:"Meta has retired many Page metrics. Whatever still returns data is shown; the rest are skipped rather than shown as zero.",
};

let RANGE = 30, TAB = "overview";
let charts = {};
let DATA = { overview:[], series:[], daily:[], posts:[], sync:[] };
let sortKey = "published_at", sortDir = -1;

/* ============================ helpers ============================ */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];

const fmt = (n) => {
  if (n === null || n === undefined || Number.isNaN(Number(n))) return "—";
  n = Number(n);
  const a = Math.abs(n);
  if (a >= 1e9) return (n/1e9).toFixed(1).replace(/\.0$/,"") + "B";
  if (a >= 1e6) return (n/1e6).toFixed(1).replace(/\.0$/,"") + "M";
  if (a >= 1e4) return (n/1e3).toFixed(0) + "K";
  return n.toLocaleString();
};
const signed = (n) => (n === null || n === undefined) ? "—" : (n > 0 ? "+" : "") + fmt(n);
const cls = (n) => n > 0 ? "up" : n < 0 ? "down" : "";
const daysAgoISO = (d) => { const x = new Date(); x.setUTCDate(x.getUTCDate() - d); return x.toISOString().slice(0,10); };
const shortDate = (s) => s ? new Date(s).toLocaleDateString(undefined,{month:"short",day:"numeric"}) : "—";
const ago = (s) => {
  if (!s) return "never";
  const m = Math.round((Date.now() - new Date(s)) / 60000);
  if (m < 60) return `${m}m ago`;
  if (m < 1440) return `${Math.round(m/60)}h ago`;
  return `${Math.round(m/1440)}d ago`;
};
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) =>
  ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
const titleise = (s) => String(s).replace(/_/g," ").replace(/^./, (c) => c.toUpperCase());

/** Rolling totals are stored with a _28d suffix against a single date. */
const isRolling = (m) => m.endsWith("_28d");
const metricLabel = (m) => {
  const base = m.replace(/_28d$/, "");
  return METRIC_LABEL[base] ?? titleise(base);
};

function toast(text, ms = 3800) {
  const el = $("#toast");
  el.textContent = text;
  el.classList.remove("hide");
  clearTimeout(el._t);
  el._t = setTimeout(() => el.classList.add("hide"), ms);
}

function destroyCharts() {
  for (const k of Object.keys(charts)) { charts[k]?.destroy(); delete charts[k]; }
}

/* ============================ auth ============================ */
$("#sendLink").onclick = async () => {
  const email = $("#email").value.trim();
  if (!email) return ($("#authMsg").textContent = "Enter an email address.");
  $("#sendLink").disabled = true;
  const { error } = await sb.auth.signInWithOtp({
    email,
    options: {
      emailRedirectTo: window.location.href.split("#")[0],
      // Defence in depth. Open signups are disabled at the project level too, but
      // this makes the portal itself incapable of minting a user.
      shouldCreateUser: false,
    },
  });
  $("#sendLink").disabled = false;
  $("#authMsg").textContent = error
    ? error.message
    : "Link sent. Check your inbox, then come back to this tab.";
};
$("#email").addEventListener("keydown", (e) => { if (e.key === "Enter") $("#sendLink").click(); });
$("#signOut").onclick = async () => { await sb.auth.signOut(); location.reload(); };

/* ============================ data ============================ */
async function load() {
  const since = daysAgoISO(RANGE);
  const [ov, ser, day, post, syn] = await Promise.all([
    sb.from("social_accounts_overview").select("*").order("followers", { ascending:false, nullsFirst:false }),
    sb.from("social_account_series").select("*").gte("day", since).order("day"),
    sb.from("social_daily_totals").select("*").gte("day", since).order("day"),
    sb.from("social_top_posts").select("*").order("published_at", { ascending:false, nullsFirst:false }).limit(200),
    sb.from("social_sync_health").select("*"),
  ]);
  const err = [ov, ser, day, post, syn].find((r) => r.error);
  if (err) { toast(`Query failed: ${err.error.message}`); return; }

  DATA = {
    overview: ov.data ?? [], series: ser.data ?? [], daily: day.data ?? [],
    posts: post.data ?? [], sync: syn.data ?? [],
  };
  renderTabs();
  render();
}

const platforms = () => [...new Set(DATA.overview.map((r) => r.platform))].sort();

/* ============================ tabs ============================ */
function renderTabs() {
  const list = platforms();
  if (TAB !== "overview" && !list.includes(TAB)) TAB = "overview";
  $("#tabs").innerHTML = [
    `<button role="tab" data-tab="overview" aria-selected="${TAB === "overview"}">Overview</button>`,
    ...list.map((p) =>
      `<button role="tab" data-tab="${esc(p)}" aria-selected="${TAB === p}">
         <span class="dot" style="background:${COLOR[p] ?? "#8E8BD8"}"></span>${LABEL[p] ?? p}
       </button>`),
  ].join("");
  $$("#tabs button").forEach((b) => b.onclick = () => { TAB = b.dataset.tab; renderTabs(); render(); });
}

function render() {
  destroyCharts();
  $("#view").innerHTML = TAB === "overview" ? overviewHtml() : platformHtml(TAB);
  if (TAB === "overview") overviewCharts(); else platformCharts(TAB);
  wireTable();
  $$("[data-connect]").forEach((b) => b.onclick = () => connect(b.dataset.connect));
}

/* ============================ overview ============================ */
/* Only metrics that genuinely compare across platforms belong here. Views and
   watch time do not — YouTube reports them daily, Instagram only as 28-day
   totals, TikTok not at all. Those live on the platform tabs instead. */
function overviewHtml() {
  const ov = DATA.overview;
  if (!ov.length) {
    return `<div class="panel empty">
      <h3>Nothing connected yet</h3>
      <div>Link a platform to start collecting. Nothing is pulled until you do.</div>
      <div class="connectrow">
        <button class="btn" data-connect="youtube">Connect YouTube</button>
        <button class="btn" data-connect="instagram">Connect Instagram</button>
        <button class="btn" data-connect="tiktok">Connect TikTok</button>
      </div></div>`;
  }

  const since = daysAgoISO(RANGE);
  const sum = (k) => ov.reduce((a, r) => a + (Number(r[k]) || 0), 0);
  const followers = sum("followers");
  const d7 = sum("followers_delta_7d"), d28 = sum("followers_delta_28d");
  const inRange = DATA.posts.filter((p) => p.published_at && p.published_at.slice(0,10) >= since);
  const eng = inRange.reduce((a,p) => a + (Number(p.engagements)||0), 0);
  const vws = inRange.reduce((a,p) => a + (Number(p.views)||0), 0);
  const rate = vws ? ((eng / vws) * 100).toFixed(2) + "%" : "—";

  const kpis = [
    { l:"Total followers", v:fmt(followers),
      s:`<span class="${cls(d7)}">${signed(d7)}</span> in 7d · <span class="${cls(d28)}">${signed(d28)}</span> in 28d` },
    { l:`Posts published (${RANGE}d)`, v:String(inRange.length),
      s: inRange.length ? `${(inRange.length / (RANGE/7)).toFixed(1)} a week` : "nothing in this window" },
    { l:`Engagement rate (${RANGE}d)`, v:rate, s:`${fmt(eng)} interactions on ${fmt(vws)} views` },
    { l:"Platforms", v:String(platforms().length),
      s: platforms().map((p) => LABEL[p] ?? p).join(" · ") },
    { l:"Accounts", v:String(ov.length),
      s: ov.filter((a) => a.as_of).length + " with data" },
  ];

  return `
  <div class="kpis">${kpis.map((c) =>
    `<div class="kpi"><div class="label">${c.l}</div><div class="value">${c.v}</div>
     <div class="sub">${c.s}</div></div>`).join("")}</div>

  <div class="grid cols-2">
    <div>
      <div class="panel">
        <h2>Audience</h2>
        <p class="hint">Followers per platform, from the daily snapshot. This is the one number every
          platform reports the same way, which is why it's the only chart on this tab.</p>
        <div class="chartbox tall"><canvas id="chFollowers"></canvas></div>
      </div>
      ${postsPanel(DATA.posts, "Top posts", "Every account, most recent first. Click a column to sort.")}
    </div>
    <div>
      <div class="panel">
        <h2>Accounts</h2>
        <p class="hint">Latest totals and 7-day movement.</p>
        <div class="accounts">${ov.map(acctCard).join("")}</div>
      </div>
      <div class="panel">
        <h2>Sync health</h2>
        <p class="hint">Last collector run per account.</p>
        ${syncHtml()}
      </div>
    </div>
  </div>`;
}

/* ============================ platform tab ============================ */
/* Data-driven: renders whatever metrics the platform actually returned, so a
   newly connected platform needs no code here. */
function platformHtml(p) {
  const ov = DATA.overview.filter((r) => r.platform === p);
  const rows = DATA.daily.filter((d) => d.platform === p);
  const posts = DATA.posts.filter((r) => r.platform === p);

  const daily = {}, rolling = {};
  for (const r of rows) (isRolling(r.metric) ? rolling : daily)[r.metric] ??= [];
  for (const r of rows) (isRolling(r.metric) ? rolling : daily)[r.metric].push(r);

  const sum = (k) => ov.reduce((a, r) => a + (Number(r[k]) || 0), 0);
  const d7 = sum("followers_delta_7d"), d28 = sum("followers_delta_28d");
  const dailyTotal = (m) => (daily[m] ?? []).reduce((a,r) => a + Number(r.value || 0), 0);

  const kpis = [
    { l:"Followers", v:fmt(sum("followers")),
      s:`<span class="${cls(d7)}">${signed(d7)}</span> in 7d · <span class="${cls(d28)}">${signed(d28)}</span> in 28d` },
    { l:"Lifetime views", v:fmt(sum("total_views")), s:"as reported by the platform" },
    { l:"Posts", v:fmt(sum("total_posts")), s:`${posts.length} collected in detail` },
  ];
  if (daily.views) kpis.push({ l:`Views (${RANGE}d)`, v:fmt(dailyTotal("views")),
    s:`${fmt(Math.round(dailyTotal("views")/RANGE))} a day on average` });
  if (daily.reach) kpis.push({ l:`Reach (${RANGE}d)`, v:fmt(dailyTotal("reach")),
    s:"unique accounts, not impressions" });
  if (daily.watch_time_minutes) kpis.push({ l:`Watch time (${RANGE}d)`,
    v:fmt(Math.round(dailyTotal("watch_time_minutes")/60)) + " h", s:"total across all videos" });

  const rollingKeys = Object.keys(rolling).sort();
  const dailyKeys = Object.keys(daily).sort();

  return `
  <div class="kpis">${kpis.map((c) =>
    `<div class="kpi"><div class="label">${c.l}</div><div class="value">${c.v}</div>
     <div class="sub">${c.s}</div></div>`).join("")}</div>

  <div class="grid cols-2">
    <div>
      <div class="panel">
        <h2>Daily activity</h2>
        <p class="hint">${esc(CAVEAT[p] ?? "")}</p>
        ${dailyKeys.length
          ? `<div class="chartbox tall"><canvas id="chDaily"></canvas></div>`
          : `<div class="empty">No daily series from this platform yet.</div>`}
      </div>
      ${postsPanel(posts, "Posts", `Content from ${LABEL[p] ?? p}. Click a column to sort.`)}
    </div>
    <div>
      ${rollingKeys.length ? `
      <div class="panel">
        <h2>Last 28 days</h2>
        <p class="hint">Rolling totals. The platform reports these as a single figure rather than
          per day, so they can't be charted over time.</p>
        <div class="totals">${rollingKeys.map((m) =>
          `<div class="tot"><div class="n">${fmt(rolling[m].at(-1)?.value)}</div>
           <div class="l">${esc(metricLabel(m))}</div></div>`).join("")}</div>
      </div>` : ""}
      <div class="panel">
        <h2>Audience</h2>
        <p class="hint">Followers over time.</p>
        <div class="chartbox"><canvas id="chPlatFollowers"></canvas></div>
      </div>
      <div class="panel">
        <h2>Accounts</h2>
        <div class="accounts">${ov.map(acctCard).join("")}</div>
      </div>
    </div>
  </div>`;
}

/* ============================ shared pieces ============================ */
function acctCard(a) {
  return `
    <div class="acct" data-p="${esc(a.platform)}">
      <div class="head">
        <img src="${esc(a.avatar_url || "")}" alt="" loading="lazy">
        <div style="min-width:0">
          <div class="nm">${esc(a.display_name || a.handle || "account")}</div>
          <div class="hd">${LABEL[a.platform] ?? a.platform}${a.handle ? " · " + esc(a.handle) : ""}</div>
        </div>
      </div>
      <div class="row"><span>Followers</span><strong>${fmt(a.followers)}</strong></div>
      <div class="row"><span>7d</span><strong class="${cls(a.followers_delta_7d)}">${signed(a.followers_delta_7d)}${
        a.followers_pct_7d != null ? ` (${a.followers_pct_7d}%)` : ""}</strong></div>
      <div class="row"><span>Lifetime views</span><strong>${fmt(a.total_views)}</strong></div>
      <div class="row"><span>Posts</span><strong>${fmt(a.total_posts)}</strong></div>
      <div class="row"><span>As of</span><strong>${a.as_of ? shortDate(a.as_of) : "no data"}</strong></div>
    </div>`;
}

const COLS = [
  { k:"thumb", t:"", n:false },
  { k:"platform", t:"Platform", n:false },
  { k:"account", t:"Account", n:false },
  { k:"title", t:"Title", n:false },
  { k:"published_at", t:"Published", n:false },
  { k:"views", t:"Views", n:true },
  { k:"likes", t:"Likes", n:true },
  { k:"comments", t:"Comments", n:true },
  { k:"engagement_pct", t:"Eng %", n:true },
];

function postsPanel(rows, heading, hint) {
  return `<div class="panel">
    <h2>${esc(heading)}</h2>
    <p class="hint">${esc(hint)}</p>
    <div class="tablewrap"><table id="posts">
      <thead><tr>${COLS.map((c) =>
        `<th ${sortKey === c.k ? `aria-sort="${sortDir === 1 ? "ascending" : "descending"}"` : ""}>
           ${c.k === "thumb" ? "" : `<button data-k="${c.k}">${c.t}</button>`}</th>`).join("")}</tr></thead>
      <tbody>${postRows(rows)}</tbody>
    </table></div>
  </div>`;
}

function postRows(rows) {
  const numeric = new Set(COLS.filter((c) => c.n).map((c) => c.k));
  const sorted = [...rows].sort((a,b) => {
    const x = a[sortKey], y = b[sortKey];
    if (x === y) return 0;
    if (x === null || x === undefined) return 1;   // nulls always sink
    if (y === null || y === undefined) return -1;
    if (sortKey === "published_at") return (new Date(x) - new Date(y)) * sortDir;
    if (numeric.has(sortKey)) return (Number(x) - Number(y)) * sortDir;
    return String(x).localeCompare(String(y)) * sortDir;
  });
  if (!sorted.length) return `<tr><td colspan="${COLS.length}" class="empty">No posts collected yet.</td></tr>`;
  return sorted.map((p) => `
    <tr>
      <td>${p.thumbnail_url ? `<img class="thumb" src="${esc(p.thumbnail_url)}" alt="" loading="lazy">` : ""}</td>
      <td><span class="pill ${esc(p.platform)}">${LABEL[p.platform] ?? p.platform}</span></td>
      <td class="t">${esc(p.account || p.handle || "")}</td>
      <td class="t">${p.permalink
        ? `<a href="${esc(p.permalink)}" target="_blank" rel="noopener">${esc(p.title || p.caption || "(untitled)")}</a>`
        : esc(p.title || p.caption || "(untitled)")}</td>
      <td>${shortDate(p.published_at)}</td>
      <td>${fmt(p.views)}</td>
      <td>${fmt(p.likes)}</td>
      <td>${fmt(p.comments)}</td>
      <td>${p.engagement_pct != null ? p.engagement_pct + "%" : "—"}</td>
    </tr>`).join("");
}

function wireTable() {
  $$("#posts th button").forEach((b) => b.onclick = () => {
    const k = b.dataset.k;
    if (sortKey === k) sortDir *= -1; else { sortKey = k; sortDir = -1; }
    render();
  });
}

function syncHtml() {
  const rows = DATA.sync;
  if (!rows.length) return `<div class="empty">No syncs have run yet.</div>`;
  return rows
    .slice()
    .sort((a,b) => new Date(b.started_at) - new Date(a.started_at))
    .map((r) => `
      <div class="sync" title="${esc(r.message || "")}">
        <span class="led ${esc(r.status)}"></span>
        <span class="pill ${esc(r.platform)}">${LABEL[r.platform] ?? r.platform}</span>
        <span style="color:var(--mute);overflow:hidden;text-overflow:ellipsis;white-space:nowrap">
          ${esc(r.display_name || "—")}${r.status === "error" ? " · " + esc((r.message||"").slice(0,60)) : ""}
        </span>
        <span class="when">${ago(r.started_at)}</span>
      </div>`).join("");
}

/* ============================ charts ============================ */
const AXIS = {
  grid:{ color:"#2a2036", drawTicks:false },
  border:{ display:false },
  ticks:{ color:"#7d7290", font:{ size:11 }, maxRotation:0, autoSkipPadding:18 },
};
const BASE = {
  responsive:true, maintainAspectRatio:false,
  interaction:{ mode:"index", intersect:false },
  plugins:{
    legend:{ labels:{ color:"#B7AEC2", boxWidth:9, boxHeight:9, usePointStyle:true, font:{ size:11 } } },
    tooltip:{ backgroundColor:"#2c2239", borderColor:"#372c47", borderWidth:1,
              titleColor:"#FAF6EE", bodyColor:"#B7AEC2", padding:10 },
  },
  scales:{ x:AXIS, y:{ ...AXIS, ticks:{ ...AXIS.ticks, callback:(v) => fmt(v) } } },
};

function followerSeries(rows) {
  const agg = {};
  for (const r of rows) {
    const k = `${r.day}|${r.platform}`;
    agg[k] = (agg[k] ?? 0) + (Number(r.followers) || 0);
  }
  const days = [...new Set(rows.map((r) => r.day))].sort();
  const groups = [...new Set(rows.map((r) => r.platform))];
  return { days, groups, get:(d,g) => agg[`${d}|${g}`] ?? null };
}

function overviewCharts() {
  const el = $("#chFollowers");
  if (!el) return;
  const { days, groups, get } = followerSeries(DATA.series);
  charts.f = new Chart(el, {
    type:"line",
    data:{ labels: days.map(shortDate),
      datasets: groups.map((g) => ({
        label: LABEL[g] ?? g,
        data: days.map((d) => get(d,g)),
        borderColor: COLOR[g] ?? "#8E8BD8",
        backgroundColor: (COLOR[g] ?? "#8E8BD8") + "1f",
        borderWidth:2, pointRadius:0, pointHoverRadius:4, tension:.3, spanGaps:true, fill:true,
      })) },
    options: BASE,
  });
}

function platformCharts(p) {
  const rows = DATA.daily.filter((d) => d.platform === p && !isRolling(d.metric));
  const el = $("#chDaily");
  if (el && rows.length) {
    const days = [...new Set(rows.map((r) => r.day))].sort();
    const metrics = [...new Set(rows.map((r) => r.metric))].sort();
    const idx = new Map(rows.map((r) => [`${r.day}|${r.metric}`, Number(r.value) || 0]));
    // Headline metric as bars, everything else as thin lines on a second axis.
    const head = metrics.includes("views") ? "views" : metrics.includes("reach") ? "reach" : metrics[0];
    const rest = metrics.filter((m) => m !== head && !/^avg_/.test(m));
    const ramp = ["#8E8BD8","#C8A24C","#E3C57E","#B7AEC2","#C0593B","#1F5F5B","#2C3E5D"];

    charts.d = new Chart(el, {
      data:{ labels: days.map(shortDate), datasets:[
        { type:"bar", label: metricLabel(head), yAxisID:"y",
          data: days.map((d) => idx.get(`${d}|${head}`) ?? 0),
          backgroundColor: COLOR[p] ?? "#8E8BD8", borderRadius:2, borderSkipped:false, order:3 },
        ...rest.map((m, i) => ({
          type:"line", label: metricLabel(m), yAxisID:"y1",
          data: days.map((d) => idx.get(`${d}|${m}`) ?? 0),
          borderColor: ramp[i % ramp.length], borderWidth:1.5,
          pointRadius:0, pointHoverRadius:3, tension:.3, order:1,
        })),
      ] },
      options:{ ...BASE, scales:{
        x:AXIS,
        y:{ ...AXIS, beginAtZero:true, ticks:{ ...AXIS.ticks, callback:(v) => fmt(v) } },
        y1:{ ...AXIS, position:"right", beginAtZero:true, grid:{ display:false },
             ticks:{ ...AXIS.ticks, callback:(v) => fmt(v) } },
      } },
    });
  }

  const fel = $("#chPlatFollowers");
  if (fel) {
    const rows2 = DATA.series.filter((r) => r.platform === p);
    const { days, get } = followerSeries(rows2);
    charts.pf = new Chart(fel, {
      type:"line",
      data:{ labels: days.map(shortDate), datasets:[{
        label:"Followers",
        data: days.map((d) => get(d, p)),
        borderColor: COLOR[p] ?? "#8E8BD8",
        backgroundColor: (COLOR[p] ?? "#8E8BD8") + "1f",
        borderWidth:2, pointRadius:0, pointHoverRadius:4, tension:.3, spanGaps:true, fill:true,
      }] },
      options:{ ...BASE, plugins:{ ...BASE.plugins, legend:{ display:false } } },
    });
  }
}

/* ============================ actions ============================ */
async function connect(platform) {
  const { data:{ session } } = await sb.auth.getSession();
  const res = await fetch(`${SUPABASE_URL}/functions/v1/oauth-start?platform=${platform}`,
    { headers:{ Authorization:`Bearer ${session.access_token}`, apikey:SUPABASE_KEY } });
  const body = await res.json();
  if (body.url) window.open(body.url, "_blank", "noopener");
  else toast(body.error || "Could not start the connect flow.");
}

$("#connectBtn").onclick = () => {
  const p = prompt(
    "Connect which platform?\n\n  youtube\n  instagram  (no Facebook Page needed)\n  meta       (Facebook Pages)\n  tiktok",
    TAB === "overview" ? "youtube" : TAB);
  if (p) connect(p.trim().toLowerCase());
};

$("#syncBtn").onclick = async () => {
  const btn = $("#syncBtn");
  btn.disabled = true; btn.textContent = "Syncing…";
  try {
    const { data:{ session } } = await sb.auth.getSession();
    const res = await fetch(`${SUPABASE_URL}/functions/v1/sync-all`, {
      method:"POST",
      headers:{ Authorization:`Bearer ${session.access_token}`, apikey:SUPABASE_KEY },
    });
    const body = await res.json();
    toast(body.failed ? `Sync finished with ${body.failed} failing collector(s) — see Sync health.` : "Sync complete.");
  } catch (e) {
    toast(`Sync failed: ${e.message}`);
  } finally {
    btn.disabled = false; btn.textContent = "Sync now";
    await load();
  }
};

$$("#range button").forEach((b) => b.onclick = () => {
  $$("#range button").forEach((x) => x.removeAttribute("aria-pressed"));
  b.setAttribute("aria-pressed", "true");
  RANGE = Number(b.dataset.d);
  load();
});

/* ============================ boot ============================ */
let booted = false;
function applySession(session) {
  const signedIn = !!session;
  $("#gate").classList.toggle("hide", signedIn);
  $("#app").classList.toggle("hide", !signedIn);
  if (signedIn && !booted) { booted = true; load(); }
  if (!signedIn) booted = false;
}
sb.auth.onAuthStateChange((_e, session) => applySession(session));
applySession((await sb.auth.getSession()).data.session);
</script>
</body>
</html>
